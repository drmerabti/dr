<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم تفعيل الاشتراك — أكاديمية مرابطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<style>
  .status-wrap{
    max-width: 480px; margin: 80px auto; text-align: center; padding: 0 20px;
  }
  .status-icon{
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 24px;
    background: #E6F6EC; display: flex; align-items: center; justify-content: center;
  }
  .status-icon svg{ width: 40px; height: 40px; color: #1E8A52; }
  .status-title{ font-size: 1.5rem; font-weight: 900; color: var(--ink); margin: 0 0 10px; }
  .status-sub{ font-size: .95rem; color: var(--ink-soft); margin: 0 0 30px; line-height: 1.7; }
  .status-btn{
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 700; font-size: .92rem; padding: 12px 30px; border-radius: 999px;
  }
  .status-btn:hover{ opacity: .9; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">د. سفيان مرابطي</a>
  </div>
</header>

<main>
  <div class="status-wrap">
    <div class="status-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 class="status-title">تم تفعيل اشتراكك بنجاح</h1>
    <p class="status-sub">صار عندك وصول كامل لكل الميزات المدفوعة بالموقع. شكرًا لثقتك بأكاديمية مرابطي.</p>
    <a href="index.html" class="status-btn">الرجوع للصفحة الرئيسية</a>
  </div>
</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

</body>
</html>
