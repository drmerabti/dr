name = "dr"
main = "worker.js"
compatibility_date = "2025-01-01"

# Paid downloads: /api/checkout, /api/chargily-webhook, /api/purchase-status,
# /api/download and /api/purchase-health are forwarded by worker.js to the
# Vercel deployment of main (the functions in api/ run there).
[vars]
VERCEL_API_ORIGIN = "https://dr-git-main-merabti.vercel.app"

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "surveysdb"
database_id = "dfe47a68-cef0-4841-946b-aa8112011441"
