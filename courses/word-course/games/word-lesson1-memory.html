<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الذاكرة — الدرس الأول: مقدمة Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif; direction:rtl;
    background:
      radial-gradient(circle at 15% 10%, rgba(122,63,168,.10), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(47,92,168,.10), transparent 40%),
      radial-gradient(circle at 50% 100%, #E9F1F6, #C8DAE5 85%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{ max-width:600px; width:100%; }

  h1{
    font-size:26px; font-weight:900; text-align:center; margin-bottom:4px;
    background:linear-gradient(90deg,#1B3A52,#3A6B87,#5FA3C9);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:200% auto; animation:shine 4s linear infinite;
  }
  @keyframes shine{ to{ background-position:200% center; } }
  .sub{ font-size:14px; color:#64768A; text-align:center; margin-bottom:14px; }

  .timer{
    text-align:center; font-size:40px; font-weight:900; color:#1B3A52;
    letter-spacing:1px; margin-bottom:14px; font-variant-numeric:tabular-nums;
    transition:transform .2s ease;
  }
  .timer.pulse{ transform:scale(1.1); }

  .dashboard{
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(135deg,#1B3A52,#2F5770);
    border-radius:20px; padding:16px 22px; margin-bottom:18px;
    box-shadow:0 6px 0 #0F2536, 0 16px 30px rgba(21,36,49,.25);
  }
  .stat{ text-align:center; min-width:64px; }
  .stat .num{ font-size:26px; font-weight:900; color:#FFD166; transition:transform .25s ease; display:inline-block; }
  .stat .num.pulse{ transform:scale(1.35); }
  .stat .lbl{ font-size:11px; color:#A8C6DC; font-weight:800; margin-top:2px; }

  .progress-wrap{ flex:1; margin:0 16px; }
  .progress-track{ height:8px; background:rgba(255,255,255,.15); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg,#FFD166,#F5A623); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.3,1.2); }

  #restartBtn{
    background:linear-gradient(145deg,#FFD166,#E0A020); color:#4A2E00; border:none;
    padding:12px 20px; border-radius:20px; font-weight:900; font-size:13px;
    font-family:'Tajawal',sans-serif; cursor:pointer;
    box-shadow:0 4px 0 #A66B00; transition:transform .12s ease, box-shadow .12s ease;
  }
  #restartBtn:hover{ transform:translateY(-2px); box-shadow:0 6px 0 #A66B00; }
  #restartBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #A66B00; }

  .grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:10px;
    background:#DCEEE4; padding:16px; border-radius:22px;
    box-shadow:0 4px 0 #8FC2A8, 0 16px 28px rgba(31,94,63,.18);
  }
  .card{
    aspect-ratio:1; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    perspective:500px; user-select:none;
  }
  .card-inner{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.3,1.2);
  }
  .card.flipped .card-inner, .card.matched .card-inner{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0; border-radius:14px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    text-align:center; line-height:1.15; padding:5px;
  }
  .card-back{
    background:linear-gradient(145deg,#3A6B87,#1B3A52);
    box-shadow:0 3px 0 #14283A;
    color:#8FB4CC; font-size:22px; font-weight:900;
  }
  .card:not(.flipped):not(.matched):hover .card-back{
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 9px 0 #14283A, 0 16px 22px rgba(20,40,58,.4);
  }

  .card-front{ transform:rotateY(180deg); box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .card-front .icon{ font-size:24px; }
  .card-front .tx{ font-size:12px; font-weight:900; }

  .pair-0 .card-front{ background:linear-gradient(145deg,#8FC6F0,#5B9FD6); color:#0B3A5C; }
  .pair-1 .card-front{ background:linear-gradient(145deg,#9EDCB8,#5FBE88); color:#0F4A28; }
  .pair-2 .card-front{ background:linear-gradient(145deg,#F5C989,#E0A040); color:#6B3E00; }
  .pair-3 .card-front{ background:linear-gradient(145deg,#F0A8C6,#D6659A); color:#5C0B33; }
  .pair-4 .card-front{ background:linear-gradient(145deg,#C9B3F0,#9B6FD6); color:#2E0B5C; }
  .pair-5 .card-front{ background:linear-gradient(145deg,#F0C9A8,#D68F5B); color:#5C2B0B; }
  .pair-6 .card-front{ background:linear-gradient(145deg,#A8E0DC,#5BBEB4); color:#0B4A44; }
  .pair-7 .card-front{ background:linear-gradient(145deg,#F0E0A8,#D6BE5B); color:#5C4A0B; }
  .pair-8 .card-front{ background:linear-gradient(145deg,#D6A8F0,#B45BD6); color:#3A0B5C; }
  .pair-9 .card-front{ background:linear-gradient(145deg,#A8C6F0,#5B8FD6); color:#0B2E5C; }

  .card.matched .card-front{
    box-shadow:0 3px 0 rgba(0,0,0,.18), 0 0 18px rgba(255,209,102,.75);
    animation:matchPop .4s ease;
  }
  @keyframes matchPop{ 0%{ transform:rotateY(180deg) scale(1); } 40%{ transform:rotateY(180deg) scale(1.18); } 100%{ transform:rotateY(180deg) scale(1); } }
  .card.wrong .card-inner{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:rotateY(180deg) translateX(0);} 25%{transform:rotateY(180deg) translateX(-5px);} 75%{transform:rotateY(180deg) translateX(5px);} }

  .win-overlay{
    position:fixed; inset:0; background:rgba(21,36,49,.6);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .win-overlay.show{ display:flex; }
  .win-box{
    background:#fff; border-radius:24px; padding:34px; text-align:center; max-width:320px;
    box-shadow:0 24px 50px rgba(0,0,0,.35);
  }
  .win-box h2{ font-size:20px; margin:6px 0 6px; color:#152431; }
  .win-box p{ font-size:14px; color:#64768A; margin-bottom:22px; }
  .win-box button{
    background:linear-gradient(145deg,#4FC589,#2C8058); color:#fff; border:none;
    padding:13px 28px; border-radius:24px; font-weight:800; font-size:14px;
    font-family:'Tajawal',sans-serif; cursor:pointer; box-shadow:0 4px 0 #1F6B44;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>لعبة الذاكرة</h1>
  <p class="sub">الدرس الأول — مقدمة عن برنامج Word</p>

  <div class="timer" id="timerValue">00:00</div>

  <div class="dashboard">
    <div class="stat"><div class="num" id="movesCount">0</div><div class="lbl">محاولات</div></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="stat"><div class="num" id="matchedCount">0/10</div><div class="lbl">تطابقات</div></div>
    <button id="restartBtn">خلط جديد</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <h2>أحسنت! أنهيت اللعبة</h2>
    <p id="winStats"></p>
    <button onclick="startGame()">جولة جديدة</button>
  </div>
</div>

<script>
const PAIRS = [
  { a: {ic:'🏷️', tx:'شريط العنوان'}, b: {ic:'📛', tx:'يعرض اسم المستند'} },
  { a: {ic:'⚡', tx:'شريط الوصول السريع'}, b: {ic:'💾', tx:'حفظ وتراجع سريع'} },
  { a: {ic:'📑', tx:'الشريط الرئيسي'}, b: {ic:'🗂️', tx:'كل الأدوات والتبويبات'} },
  { a: {ic:'📝', tx:'مساحة الكتابة'}, b: {ic:'✍️', tx:'مكان كتابة النص'} },
  { a: {ic:'📏', tx:'المسطرة'}, b: {ic:'↔️', tx:'ضبط الهوامش'} },
  { a: {ic:'📊', tx:'شريط الحالة'}, b: {ic:'🔢', tx:'عدد الصفحات والكلمات'} },
  { a: {ic:'🔍', tx:'أدوات التكبير'}, b: {ic:'📐', tx:'التحكم بحجم العرض'} },
  { a: {ic:'📃', tx:'مستند جديد'}, b: {ic:'⬜', tx:'صفحة فارغة للكتابة'} },
  { a: {ic:'🖱️', tx:'فتح Word'}, b: {ic:'▶️', tx:'أول خطوة للاستخدام'} },
  { a: {ic:'🖥️', tx:'واجهة البرنامج'}, b: {ic:'👁️', tx:'الشكل العام للأدوات'} },
];

let cards = [], flipped = [], matchedCount = 0, moves = 0, lock = false;
let seconds = 0, timerInterval = null;

function buildDeck(){
  const deck = [];
  PAIRS.forEach((p, i) => {
    deck.push({ pairId: i, ...p.a });
    deck.push({ pairId: i, ...p.b });
  });
  for (let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function pulse(el){
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 250);
}

function startGame(){
  document.getElementById('winOverlay').classList.remove('show');
  cards = buildDeck();
  flipped = []; matchedCount = 0; moves = 0; lock = false;
  document.getElementById('movesCount').textContent = '0';
  document.getElementById('matchedCount').textContent = '0/' + PAIRS.length;
  document.getElementById('progressFill').style.width = '0%';

  seconds = 0;
  document.getElementById('timerValue').textContent = '00:00';
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    const timerEl = document.getElementById('timerValue');
    timerEl.textContent = m + ':' + s;
    if (seconds % 10 === 0) pulse(timerEl);
  }, 1000);

  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cards.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card pair-' + card.pairId;
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">؟</div>
        <div class="card-face card-front">
          <span class="icon">${card.ic}</span>
          <span class="tx">${card.tx}</span>
        </div>
      </div>`;
    el.addEventListener('click', () => flipCard(idx));
    grid.appendChild(el);
  });
}

function flipCard(idx){
  if (lock) return;
  const el = document.querySelector(`.card[data-idx="${idx}"]`);
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flipped.length === 2) return;

  el.classList.add('flipped');
  flipped.push(idx);

  if (flipped.length === 2){
    moves++;
    const movesEl = document.getElementById('movesCount');
    movesEl.textContent = moves;
    pulse(movesEl);
    lock = true;
    const [i1, i2] = flipped;
    const c1 = cards[i1], c2 = cards[i2];
    if (c1.pairId === c2.pairId){
      setTimeout(() => {
        document.querySelector(`.card[data-idx="${i1}"]`).classList.add('matched');
        document.querySelector(`.card[data-idx="${i2}"]`).classList.add('matched');
        matchedCount++;
        const matchEl = document.getElementById('matchedCount');
        matchEl.textContent = matchedCount + '/' + PAIRS.length;
        pulse(matchEl);
        document.getElementById('progressFill').style.width = (matchedCount / PAIRS.length * 100) + '%';
        flipped = []; lock = false;
        if (matchedCount === PAIRS.length){
          clearInterval(timerInterval);
          setTimeout(() => {
            document.getElementById('winStats').textContent = `أنهيتها في ${moves} محاولة، خلال ${document.getElementById('timerValue').textContent}`;
            document.getElementById('winOverlay').classList.add('show');
          }, 400);
        }
      }, 500);
    } else {
      const el1 = document.querySelector(`.card[data-idx="${i1}"]`);
      const el2 = document.querySelector(`.card[data-idx="${i2}"]`);
      el1.classList.add('wrong'); el2.classList.add('wrong');
      setTimeout(() => {
        el1.classList.remove('flipped', 'wrong');
        el2.classList.remove('flipped', 'wrong');
        flipped = []; lock = false;
      }, 900);
    }
  }
}

document.getElementById('restartBtn').addEventListener('click', startGame);
startGame();
</script>

</body>
</html>
