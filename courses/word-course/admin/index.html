<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأسئلة — دورة Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="../../../favicon.ico">
<link rel="stylesheet" href="../../../style.css">
<style>
  .hidden{ display:none; }
  .admin-wrap{ max-width:900px; margin:0 auto; }
  .thread-list{ display:flex; flex-direction:column; gap:12px; }
  .thread-card{
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding:18px 20px; cursor:pointer; border:2px solid transparent;
  }
  .thread-card.active{ border-color: var(--accent); }
  .thread-card .meta{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--ink-soft); margin-bottom:6px; }
  .thread-card .preview{ font-size:.9rem; color:var(--ink); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread-card .unread-dot{ width:9px; height:9px; border-radius:50%; background:#C0392B; display:inline-block; margin-inline-start:6px; }

  .thread-detail{
    background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
    padding:0; margin-top:16px; display:flex; flex-direction:column; height:500px;
  }
  .thread-detail-header{ padding:16px 20px; border-bottom:1px solid var(--line); font-weight:800; }
  .thread-detail-body{ flex:1; padding:16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:75%; padding:8px 13px; border-radius:12px; font-size:.88rem; line-height:1.5; }
  .msg.student{ align-self:flex-start; background: var(--accent-soft); color:var(--ink); }
  .msg.teacher{ align-self:flex-end; background: linear-gradient(135deg, var(--accent), #1B3A4D); color:#fff; }
  .thread-reply-row{ display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); }
  .thread-reply-row input{ flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-family:inherit; font-size:.88rem; }
  .thread-reply-row button{
    background: linear-gradient(135deg, var(--accent), #1B3A4D); color:#fff; border:none;
    border-radius:10px; padding:0 22px; font-family:inherit; font-weight:800; cursor:pointer;
  }
</style>
</head>
<body>

<header class="topbar site-topbar">
  <div class="topbar-inner">
    <div class="brand-cluster">
      <a href="../../../index.html" class="brand-logo" aria-label="Merabti Academy">
        <img src="../../../apple-touch-icon.png" alt="">
      </a>
      <div class="social-cluster">
        <a class="social-icon si-facebook" style="--i:0;--tx:-58px;--ty:44px" href="https://www.facebook.com/DrMerabti" target="_blank" rel="noopener" aria-label="Facebook">
          <svg viewBox="0 0 24 24"><text x="12" y="17.5" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">f</text></svg>
        </a>
        <a class="social-icon si-instagram" style="--i:1;--tx:-46px;--ty:21px" href="https://www.instagram.com/DrMerabti" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24">
            <rect x="5.5" y="5.5" width="13" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="15.6" cy="8.3" r="1.1" fill="currentColor"/>
          </svg>
        </a>
        <a class="social-icon si-youtube" style="--i:2;--tx:-25px;--ty:6px" href="https://www.youtube.com/mrmerabti" target="_blank" rel="noopener" aria-label="YouTube">
          <svg viewBox="0 0 24 24"><path d="M9.5 8v8l7-4z" fill="currentColor"/></svg>
        </a>
        <a class="social-icon si-tiktok" style="--i:3;--tx:0px;--ty:0px" href="https://www.tiktok.com/@drmerabti" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24">
            <path d="M16.6 6.5v8.2a3.9 3.9 0 1 1 -2.3-3.55V8.4h2.1c0 1.75 1.25 3.05 3.1 3.15v2.15c-1.55-.1-2.65-.95-3.2-2.15" fill="none" stroke="#EE1D52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.7,0.5)"/>
            <path d="M16.6 6.5v8.2a3.9 3.9 0 1 1 -2.3-3.55V8.4h2.1c0 1.75 1.25 3.05 3.1 3.15v2.15c-1.55-.1-2.65-.95-3.2-2.15" fill="none" stroke="#25F4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0.7,-0.5)"/>

          <svg viewBox="0 0 24 24">

          </svg>
        </a>
        <a class="social-icon si-linkedin" style="--i:5;--tx:46px;--ty:21px" href="https://www.linkedin.com/in/soufiane-merabti/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">in</text></svg>
        </a>
        <a class="social-icon si-researchgate" style="--i:6;--tx:58px;--ty:44px" href="https://www.researchgate.net/profile/Soufiane-Merabti" target="_blank" rel="noopener" aria-label="ResearchGate">
          <svg viewBox="0 0 24 24"><text x="12" y="16.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="currentColor">RG</text></svg>
        </a>
      </div>
    </div>
  </div>
</header>

<main>
<div class="admin-wrap">
  <div id="loadingScreen"><p style="text-align:center; color:var(--ink-soft);">جارٍ التحميل...</p></div>

  <div class="hidden" id="deniedScreen">
    <p style="text-align:center; color:var(--ink-soft); margin-top:60px;">هذه الصفحة خاصة بالمدير فقط.</p>
  </div>

  <div class="hidden" id="panelScreen">
    <h2 class="view-title">أسئلة المتعلّمين</h2>
    <div class="thread-list" id="threadList"></div>

    <div class="thread-detail hidden" id="threadDetail">
      <div class="thread-detail-header" id="threadDetailHeader"></div>
      <div class="thread-detail-body" id="threadDetailBody"></div>
      <div class="thread-reply-row">
        <input type="text" id="replyInput" placeholder="اكتب ردّك...">
        <button type="button" id="replySendBtn">إرسال</button>
      </div>
    </div>
  </div>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../../firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
