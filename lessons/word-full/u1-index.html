<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوحدة 1: التعرف على Word — أكاديمية مرابطي</title>
<meta name="description" content="سبعة دروس تمهيدية للتعرف على برنامج Word وواجهته وأساسيات التعامل مع الملفات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="beginner.html" class="icon-btn" id="backBtn" aria-label="العودة إلى وحدات المستوى">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
</div>

<header class="lesson-head">
  <p class="lesson-crumb" style="text-align:center;">مبتدئ ← الوحدة 1</p>
  <h1 class="lesson-title">التعرف على Word</h1>
  <p class="lesson-sub">سبعة دروس تمهيدية بسيطة تعرّفك على البرنامج وواجهته</p>
</header>

<main class="wrap">
  <div class="sc-grid" id="lessonsGrid"></div>
</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

<script>
const LESSONS = [
  { n: 1, title: "ما هو Microsoft Word؟", desc: "مقدمة عامة عن البرنامج واستخداماته", href: "u1-l1.html" },
  { n: 2, title: "واجهة البرنامج ومكوناتها", desc: "جولة على الشريط والتبويبات ومنطقة الكتابة", href: "u1-l2.html" },
  { n: 3, title: "إنشاء مستند جديد", desc: "كيف تبدأ مستندًا فارغًا من الصفر", href: "u1-l3.html" },
  { n: 4, title: "فتح وحفظ وإغلاق المستند", desc: "العمليات الأساسية الثلاث لأي ملف", href: "u1-l4.html" },
  { n: 5, title: "الفرق بين Save و Save As", desc: "متى تستخدم كل واحدة منهما", href: "u1-l5.html" },
  { n: 6, title: "أنواع ملفات Word", desc: "docx، pdf، rtf... ومتى تستخدم كل صيغة", href: "u1-l6.html" },
  { n: 7, title: "التعامل مع المستندات الأخيرة", desc: "الوصول السريع لملفاتك الأخيرة", href: "u1-l7.html" },
];

function getProgress() {
  try { return JSON.parse(localStorage.getItem("word_full_progress")) || {}; }
  catch (e) { return {}; }
}

const progress = (getProgress().u1) || {};
const grid = document.getElementById("lessonsGrid");
grid.innerHTML = LESSONS.map((l) => `
  <a href="${l.href}" class="sc-card lesson-card" style="text-decoration:none;">
    ${progress[l.n] ? `<span class="lesson-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span>` : ""}
    <div class="sc-body">
      <span class="lesson-num-badge">${l.n}</span>
      <p class="sc-name">${l.title}</p>
      <p class="sc-desc">${l.desc}</p>
    </div>
  </a>`).join("");
</script>
</body>
</html>
