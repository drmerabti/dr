<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">التدريب على لوحة المفاتيح — أكاديمية مرابطي</title>
<meta name="description" content="تدرّب على الكتابة بالعشر أصابع بالعربية والفرنسية والإنجليزية عبر 8 مراحل تصاعدية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="../../resources.html" class="icon-btn" id="backBtn" aria-label="رجوع" title="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <span class="topbar-title" id="topbarTitle">التدريب على لوحة المفاتيح</span>
  <div class="topbar-actions">
    <button type="button" class="icon-btn tool" id="kbToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg>
    </button>
    <button type="button" class="icon-btn tool" id="handsToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6 7-2.5 0-4-1.5-5.5-4L4 13.5a1.5 1.5 0 0 1 2.5-1.5L8 14"/></svg>
    </button>
    <button type="button" class="icon-btn tool" id="soundToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button type="button" class="icon-btn tool" id="fsToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div class="lang-switch" role="group" aria-label="Language switcher">
      <button type="button" class="lang-btn" data-lang="ar">عربي</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="fr">FR</button>
    </div>
  </div>
</div>

<main class="wrap">

  <!-- ============ STAGES ============ -->
  <section id="stagesScreen" class="screen">
    <h1 class="page-title" id="stagesTitle"></h1>
    <p class="page-sub" id="stagesSub"></p>
    <div class="layout-picker" id="layoutPicker">
      <button type="button" class="layout-btn" data-layout="ar">العربية</button>
      <button type="button" class="layout-btn" data-layout="fr">Français · AZERTY</button>
      <button type="button" class="layout-btn" data-layout="en">English · QWERTY</button>
    </div>
    <p class="layout-hint" id="layoutHint"></p>
    <p class="mobile-note hidden" id="mobileNote"></p>
    <div class="levels-grid stages" id="stagesGrid"></div>
  </section>

  <!-- ============ EXERCISES OF A STAGE ============ -->
  <section id="exercisesScreen" class="screen hidden">
    <h1 class="page-title" id="exTitle"></h1>
    <p class="page-sub" id="exSub"></p>
    <div class="ex-grid" id="exGrid"></div>
    <div class="center-actions">
      <button type="button" class="btn btn-secondary" id="exBackBtn"></button>
    </div>
  </section>

  <!-- ============ PRACTICE (full screen) ============ -->
  <section id="practiceScreen" class="screen hidden">
    <div class="practice-head">
      <div class="practice-name" id="practiceName"></div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="live-stats" id="liveStats">
        <div class="stat"><b id="liveWpm">0</b><span id="liveWpmLbl"></span></div>
        <div class="stat"><b id="liveAcc">100%</b><span id="liveAccLbl"></span></div>
      </div>
    </div>

    <div class="type-area" id="typeArea">
      <div class="tiles-view hidden" id="tilesView"><div class="tiles-track" id="tilesTrack"></div></div>
      <div class="text-view hidden" id="textView"><div class="text-inner" id="textInner"></div></div>
      <p class="hint-line" id="hintLine"></p>
    </div>

    <div class="kb-wrap" id="kbWrap">
      <div class="kb" id="keyboard"></div>
      <div class="finger-name" id="fingerName"></div>
      <svg class="hands" id="hands" viewBox="0 0 560 150" aria-hidden="true"></svg>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="resultScreen" class="screen hidden">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="big-stars" id="resultStars"></div>
      <p class="result-msg" id="resultMsg"></p>
      <div class="result-stats">
        <div><b id="resWpm">0</b><span id="resWpmLbl"></span></div>
        <div><b id="resAcc">0%</b><span id="resAccLbl"></span></div>
        <div><b id="resTime">0:00</b><span id="resTimeLbl"></span></div>
      </div>
      <button type="button" class="btn btn-cert hidden" id="getCertBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M8.5 13.5L7 22l5-3 5 3-1.5-8.5"/></svg>
        <span id="getCertText"></span>
      </button>
      <div class="result-actions">
        <button type="button" class="btn btn-primary" id="nextBtn"></button>
        <button type="button" class="btn btn-secondary" id="retryBtn"></button>
        <button type="button" class="btn btn-secondary" id="resBackBtn"></button>
      </div>
      <p class="kbd-tip" id="kbdTip"></p>
      <div class="share-row">
        <span class="share-label" id="shareLabel"></span>
        <a class="share-btn" id="shareWhatsapp" href="#" target="_blank" rel="noopener" title="WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3C4.4 15 4 13.5 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8z"/></svg>
        </a>
        <a class="share-btn" id="shareTelegram" href="#" target="_blank" rel="noopener" title="Telegram">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 2 2 10l6 2 2 7 4-4 5 4 3-17z"/></svg>
        </a>
      </div>
    </div>
  </section>

  <!-- ============ LOGIN REQUIRED ============ -->
  <section id="lockedScreen" class="screen hidden">
    <div class="locked-card">
      <div class="locked-icon">🔒</div>
      <h2 class="locked-title" id="lockedTitle"></h2>
      <p class="locked-msg" id="lockedMsg"></p>
      <div class="result-actions">
        <a href="../../index.html" class="btn btn-primary" id="goLoginBtn"></a>
        <button type="button" class="btn btn-secondary" id="lockedBackBtn"></button>
      </div>
    </div>
  </section>

  <!-- ============ INTRO (before an exercise) ============ -->
  <div class="overlay hidden" id="introOverlay">
    <div class="overlay-box">
      <h3 class="overlay-title" id="introTitle"></h3>
      <div class="intro-keys" id="introKeys"></div>
      <p class="intro-text" id="introText"></p>
      <button type="button" class="btn btn-primary btn-block" id="introStartBtn"></button>
      <p class="press-hint" id="introPress"></p>
    </div>
  </div>

  <!-- ============ CERTIFICATE NAME ============ -->
  <div class="overlay hidden" id="certNameOverlay">
    <div class="overlay-box">
      <h3 class="overlay-title" id="certNameTitle"></h3>
      <p class="overlay-hint" id="certNameHint"></p>
      <input type="text" id="certFirstName" class="cert-input">
      <input type="text" id="certLastName" class="cert-input">
      <div class="cert-lang-row">
        <button type="button" class="cert-lang-btn" data-clang="ar">عربي</button>
        <button type="button" class="cert-lang-btn" data-clang="en">English</button>
      </div>
      <div class="overlay-actions">
        <button type="button" class="btn btn-primary btn-block" id="certNameContinueBtn"></button>
      </div>
    </div>
  </div>

  <!-- ============ CERTIFICATE PREVIEW ============ -->
  <div class="overlay hidden" id="certPreviewOverlay">
    <div class="overlay-box overlay-box-wide">
      <h3 class="overlay-title" id="certPreviewTitle"></h3>
      <div class="cert-preview-wrap"><img id="certPreviewImg" alt="Certificate"></div>
      <div class="overlay-actions cert-preview-actions">
        <button type="button" class="btn btn-secondary" id="certCloseBtn"></button>
        <button type="button" class="btn btn-secondary" id="certShareBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6L8.6 10.5"/></svg>
          <span id="certShareText"></span>
        </button>
        <button type="button" class="btn btn-primary" id="certDownloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 21h14"/></svg>
          <span id="certDownloadText"></span>
        </button>
      </div>
    </div>
  </div>

</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
