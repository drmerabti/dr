/* same size as the Word book: 170 x 240 mm */
@page { size: 481.89pt 680.315pt; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 481.89pt; height: 680.315pt; background: #fff; }
.page { position: relative; width: 481.89pt; height: 680.315pt; overflow: hidden; text-align: center; color: #0f2d5c; }

.pill { position: absolute; top: 60pt; left: 50%; transform: translateX(-50%);
  height: 24pt; padding: 0 14.4pt; border-radius: 12pt; background: #0f2d5c; color: #f5b800;
  font: 700 10.5pt/24pt Cairo; white-space: nowrap; }
h1 { position: absolute; top: 84pt; left: 0; right: 0; font: 800 24pt/51pt Cairo; color: #0f2d5c; }
.sub { position: absolute; top: 129.2pt; left: 50%; transform: translateX(-50%); width: 340pt;
  font: 400 10.5pt/18.7pt Tajawal; color: #444; }

.grid { position: absolute; top: 182pt; left: 0; right: 0; margin: 0 auto; width: 340pt;
  display: grid; grid-template-columns: repeat(4, 76pt); column-gap: 12pt; row-gap: 12.4pt; direction: rtl; }
.grid a { display: block; width: 76pt; height: 107.6pt; border-radius: 4.5pt; overflow: hidden;
  box-shadow: 0 0 0 .75pt rgba(0,0,0,.08), 0 3pt 9pt rgba(15,45,92,.28); }
.grid img { display: block; width: 100%; height: 100%; object-fit: cover; }

.cta { position: absolute; top: 548pt; left: 50%; transform: translateX(-50%); width: 164.2pt; height: 58.5pt;
  border-radius: 10pt; background: #0f2d5c; text-decoration: none; }
.cta b { position: absolute; top: 7pt; left: 0; right: 0; font: 800 13pt/24pt Cairo; color: #fff; }
.cta small { position: absolute; top: 35.5pt; left: 0; right: 0; font: 600 9.5pt/11pt Inter; color: #f5b800; direction: ltr; }

.logo { position: absolute; left: 49pt; top: 640pt; width: 92pt; height: 23pt; }
.logo svg { position: absolute; left: 0; top: 0; width: 92pt; height: 23pt; overflow: visible; }
.logo span { position: absolute; left: 7.1pt; top: 1.2pt; font: 12.5pt/18pt Kaushan; color: #0f2d5c; direction: ltr; white-space: nowrap; }
</style>
