<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">تدريب شامل في وورد — أكاديمية مرابطي</title>
<meta name="description" content="اختبر معلوماتك في مايكروسوفت وورد عبر 5 مستويات تصاعدية، 30 سؤال لكل مستوى.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="../../resources.html" class="icon-btn" id="backBtn" aria-label="رجوع للموقع" title="رجوع للموقع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <span class="topbar-title" id="topbarTitle">تدريب شامل في وورد</span>
  <div class="lang-switch" role="group" aria-label="Language switcher">
    <button type="button" class="lang-btn" data-lang="ar">عربي</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="fr">FR</button>
  </div>
</div>

<main class="wrap">

  <!-- ============ LEVEL SELECT SCREEN ============ -->
  <section id="levelSelectScreen" class="screen">
    <h1 class="page-title" id="pageTitle">اختر المستوى</h1>
    <p class="page-sub" id="pageSub">5 مستويات، 30 سؤال لكل مستوى — كل سؤال 15 ثانية</p>
    <div class="levels-grid" id="levelsGrid"></div>
  </section>

  <!-- ============ QUIZ SCREEN ============ -->
  <section id="quizScreen" class="screen hidden">
    <div class="quiz-head">
      <div class="timer-display" id="timerDisplay">
        <span class="timer-emoji">⏰</span>
        <span id="timerText">00:15</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-label" id="progressLabel">سؤال 1 من 30</p>
    </div>

    <div class="question-card">
      <p class="question-text" id="questionText"></p>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </section>

  <!-- ============ RESULT SCREEN ============ -->
  <section id="resultScreen" class="screen hidden">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 class="result-title" id="resultTitle">أحسنت!</h2>
      <p class="result-msg" id="resultMsg"></p>
      <div class="result-pct" id="resultPct">0%</div>
      <p class="result-score" id="resultScore"></p>
      <div class="result-actions">
        <button type="button" class="btn btn-primary" id="backToLevelsBtn">رجوع للمستويات</button>
      </div>
      <div class="share-row">
        <span class="share-label" id="shareLabel">شارك إنجازك:</span>
        <a class="share-btn" id="shareWhatsapp" href="#" target="_blank" rel="noopener" title="WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3C4.4 15 4 13.5 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8z"/></svg>
        </a>
        <a class="share-btn" id="shareTelegram" href="#" target="_blank" rel="noopener" title="Telegram">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 2 2 10l6 2 2 7 4-4 5 4 3-17z"/></svg>
        </a>
      </div>
    </div>
  </section>

  <!-- ============ LOGIN REQUIRED SCREEN ============ -->
  <section id="lockedScreen" class="screen hidden">
    <div class="locked-card">
      <div class="locked-icon">🔒</div>
      <h2 class="locked-title" id="lockedTitle">هذا المستوى يتطلب تسجيل الدخول</h2>
      <p class="locked-msg" id="lockedMsg">سجّل دخولك من الصفحة الرئيسية لفتح المستويات 3، 4، و5، ولحفظ تقدمك.</p>
      <div class="result-actions">
        <a href="../../index.html" class="btn btn-primary" id="goLoginBtn">الذهاب لتسجيل الدخول</a>
        <button type="button" class="btn btn-secondary" id="lockedBackBtn">رجوع للمستويات</button>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="../../lessons/word-shortcuts/data.js"></script>
<script src="questions-general.js"></script>
<script src="script.js"></script>
</body>
</html>
