<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6PKBD7XR0M"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>غرفة التدريب المباشر | Dr Soufiane Merabti</title>
<meta name="description" content="مسابقة تدريبية حيّة: ادخل الغرفة برمز المدرّب وأجب أسرع من زملائك وتابع ترتيبك لحظة بلحظة.">
<meta name="theme-color" content="#05070D">
<link rel="icon" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="hall.css">
<script src="/analytics.js"></script>
</head>
<body class="lr">

<!-- القاعة: كلها CSS (إضاءة مسلّطة، أرضية بمنظور، أضواء جانبية، حواف معتمة) -->
<div class="hall" id="hall" aria-hidden="true">
  <div class="hall-img" id="hallImg"></div>
  <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
  <div class="floor"></div>
  <div class="spot"></div>
  <div class="vignette"></div>
</div>

<!-- الشريط العلوي: اتجاه ثابت حتى لا تتحرك الأزرار عند تغيير اللغة -->
<header class="tb" dir="ltr">
  <a class="tb-logo" href="../../index.html" aria-label="Dr Soufiane Merabti"><img src="../../apple-touch-icon.png" alt="Dr Soufiane Merabti"></a>
  <a class="tb-icon" href="../../resources.html" id="backBtn" data-t-title="back">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
  </a>
  <div class="tb-title" data-t="title" dir="rtl"></div>
  <div class="tb-fill"></div>
  <div class="tb-pill hidden" id="roomPill" dir="rtl"><span class="dot"></span><span id="roomPillText"></span></div>
  <button type="button" class="tb-icon" id="muteBtn">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
  </button>
  <button type="button" class="tb-icon" id="fsBtn" data-t-title="fullscreen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</header>

<main class="stage" id="stage">

  <!-- تحميل -->
  <section class="scr" id="scrLoading"><div class="spin"></div><p data-t="loading"></p></section>

  <!-- تسجيل الدخول -->
  <section class="scr hidden" id="scrAuth">
    <div class="card">
      <img src="../../apple-touch-icon.png" alt="" class="card-logo">
      <h1 data-t="login_title"></h1>
      <p class="muted" data-t="login_sub"></p>
      <button type="button" class="btn btn-light btn-block" id="googleBtn">
        <svg viewBox="0 0 48 48" width="22" height="22"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 38.2 44 33 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span data-t="login_google"></span>
      </button>
      <div class="or"><span>أو</span></div>
      <form id="emailForm" class="form">
        <input type="email" id="emailIn" data-t-ph="email" required autocomplete="email" dir="ltr">
        <input type="password" id="passIn" data-t-ph="password" required autocomplete="current-password" dir="ltr">
        <button type="submit" class="btn btn-gold btn-block" data-t="login_btn"></button>
      </form>
      <p class="err" id="authErr"></p>
    </div>
  </section>

  <!-- رمز الغرفة -->
  <section class="scr hidden" id="scrCode">
    <div class="card">
      <h1 data-t="code_title"></h1>
      <p class="muted" data-t="code_sub"></p>
      <form id="codeForm" class="form">
        <input type="text" id="codeIn" class="code-in" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" dir="ltr" placeholder="••••••">
        <button type="submit" class="btn btn-gold btn-block" data-t="enter"></button>
      </form>
      <p class="err" id="codeErr"></p>
    </div>
  </section>

  <!-- الاسم -->
  <section class="scr hidden" id="scrName">
    <div class="card">
      <div class="room-tag" id="nameRoomTag"></div>
      <h1 data-t="name_title"></h1>
      <form id="nameForm" class="form">
        <input type="text" id="nameIn" maxlength="30" data-t-ph="name_ph" required autocomplete="nickname">
        <button type="submit" class="btn btn-gold btn-block btn-xl" data-t="enter_hall"></button>
      </form>
      <p class="err" id="nameErr"></p>
    </div>
  </section>

  <!-- رسالة (رمز ميت / مقفلة ...) -->
  <section class="scr hidden" id="scrMsg">
    <div class="card">
      <div class="msg-ico" id="msgIco">🔒</div>
      <h1 id="msgText"></h1>
      <button type="button" class="btn btn-light" id="msgBtn" data-t="try_other"></button>
    </div>
  </section>

  <!-- القاعة: كل ما يحدث بعد الدخول (انتظار، سؤال، نتيجة) يظهر فيها -->
  <div class="hall-area" id="hallArea">
    <div class="lrh-wrap" id="hallWrap"></div>

    <!-- لوحة الإجابة: الأنواع التفاعلية، وكل الأنواع على الهاتف عمودياً -->
    <section class="apanel hidden" id="desk" aria-live="polite">
      <div class="q-top">
        <div class="q-meta"><span class="q-num" id="qNum"></span><span class="q-type" id="qType"></span></div>
        <div class="timer" id="timer">
          <svg viewBox="0 0 120 120"><circle class="tr-bg" cx="60" cy="60" r="52"/><circle class="tr-fg" id="timerRing" cx="60" cy="60" r="52"/></svg>
          <b id="timerNum">20</b>
        </div>
      </div>
      <h2 class="q-text" id="qText"></h2>
      <div class="q-body" id="qBody"></div>
      <div class="q-state hidden" id="qState"></div>
      <!-- نتيجتي بعد كل سؤال (لا أرى صح أو خطأ الآخرين) -->
      <div class="rv hidden" id="rv">
        <div class="rv-me" id="rvMe"></div>
        <div class="rv-correct" id="rvCorrect"></div>
        <div class="rv-hint" data-t="rank_hint"></div>
      </div>
    </section>

    <!-- الهاتف عمودياً: نص الجدار والخمسة الأوائل بخط مقروء تحت القاعة -->
    <section class="pinfo" id="pinfo">
      <h2 id="piQ"></h2>
      <p id="piSub"></p>
      <div class="pi-top hidden" id="piTopBox"><div class="pi-h" data-t="top5"></div><ol id="piTop"></ol></div>
    </section>

    <!-- ترتيبي ونقاطي + التفاعلات -->
    <div class="mine hidden" id="mine">
      <span class="mine-score" id="myScore" data-t="my_seat"></span>
      <button type="button" class="react" data-r="clap" aria-label="تصفيق">👏</button>
      <button type="button" class="react" data-r="fire" aria-label="حماس">🔥</button>
      <button type="button" class="react" data-r="wow" aria-label="دهشة">😮</button>
    </div>
  </div>

  <!-- النهاية: منصة بثلاثة مراكز -->
  <section class="scr hidden" id="scrFinal">
    <div class="final">
      <h1 class="final-h" data-t="final_title"></h1>
      <div class="podium" id="podium"></div>
      <div class="rv-rank" id="finalRank"></div>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="core.js"></script>
<script src="parts-svg.js"></script>
<script src="bank-stage1.js"></script>
<script src="challenges.js"></script>
<script src="hall.js"></script>
<script src="script.js"></script>
</body>
</html>
