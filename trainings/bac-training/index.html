<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تدريب البكالوريا — أكاديمية مرابطي</title>
<meta name="description" content="تدرّب على أسئلة البكالوريا بأسلوب لعبة ممتعة: مراحل، نقاط، أرواح، ووقت لكل سؤال.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar-inner">
  <a class="back-link" href="../../resources.html" id="backLink">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span>رجوع إلى التدريبات</span>
  </a>
  <div class="topbar-actions">
    <div class="auth-wrap" id="authWrap">
      <button class="auth-btn" id="authBtn" type="button"></button>
      <div class="auth-menu hidden" id="authMenu"></div>
    </div>
  </div>
</div>

<!-- ============ شاشة 1: اختيار المادة ============ -->
<section id="subjectsView">
  <div class="hero">
    <div class="hero-icon" id="heroIconWrap"></div>
    <h1>تدريب البكالوريا</h1>
    <p>اختر مادة، وابدأ رحلتك عبر المراحل — كل مرحلة فيها أسئلة جديدة في كل محاولة.</p>
  </div>
  <div class="subjects-grid" id="subjectsGrid"></div>
</section>

<!-- ============ شاشة 2: خريطة المراحل ============ -->
<section id="mapView" class="hidden">
  <div class="map-topbar">
    <button type="button" class="ghost-btn" id="backToSubjectsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      المواد
    </button>
    <div class="map-title" id="mapTitle"></div>
    <span></span>
  </div>
  <div class="map-wrap" id="mapWrap">
    <div class="map-bg-symbol s1">∫</div>
    <div class="map-bg-symbol s2">π</div>
    <div class="map-bg-symbol s3">√</div>
    <div class="stage-path" id="stagePath"></div>
  </div>
</section>

<!-- ============ شاشة 3: اللعب ============ -->
<section id="playView" class="hidden">
  <div class="play-wrap">
    <div class="play-topbar">
      <button type="button" class="icon-only-btn" id="quitPlayBtn" title="خروج">✕</button>
      <div class="lives-row" id="livesRow"></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">1/15</div>
    </div>

    <div class="timer-wrap">
      <div class="timer-circle" id="timerCircle">
        <span id="timerNumber">15</span>
      </div>
    </div>

    <div class="question-card" id="questionCard">
      <div class="question-prompt" id="questionPrompt"></div>
      <div class="answer-area" id="answerArea"></div>
      <div class="feedback-bubble hidden" id="feedbackBubble"></div>
    </div>
  </div>
</section>

<!-- ============ شاشة 4: النتيجة ============ -->
<section id="resultView" class="hidden">
  <div class="result-wrap">
    <div class="result-card" id="resultCard">
      <div class="result-trophy" id="resultTrophyWrap"></div>
      <div class="result-stars" id="resultStars"></div>
      <div class="result-headline" id="resultHeadline"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="result-actions">
        <button type="button" class="pressable-btn primary" id="nextStageBtn">المرحلة التالية</button>
        <button type="button" class="pressable-btn secondary" id="retryStageBtn">إعادة المحاولة</button>
        <button type="button" class="text-btn" id="toMapBtn">خريطة المراحل</button>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">© 2026 أكاديمية مرابطي</footer>

<!-- ============ نافذة تسجيل الدخول ============ -->
<div class="modal-overlay hidden" id="authOverlay">
  <div class="modal-card">
    <button class="modal-close" id="authCloseBtn" type="button">×</button>
    <h3 id="authModalTitle">تسجيل الدخول</h3>
    <p class="modal-sub">سجّل دخولك لحفظ تقدمك والرجوع إليه من أي جهاز</p>
    <div class="auth-error hidden" id="authError"></div>
    <form id="authForm">
      <div class="field hidden" id="authNameField">
        <label>الاسم</label>
        <input type="text" id="authName" class="field-input">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="authEmail" required class="field-input">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="authPassword" required minlength="6" class="field-input">
      </div>
      <button type="submit" class="pressable-btn primary full-width" id="authSubmitBtn" style="margin-top:14px;">دخول</button>
    </form>
    <div class="modal-divider">أو</div>
    <button type="button" class="google-btn" id="googleAuthBtn">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.2-2 13.9-5.3l-6.4-5.4C29.3 36 26.8 37 24 37c-5.2 0-9.6-3.1-11.4-7.6l-6.6 5.1C9.8 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.4 5.4C40.5 36.6 43 30.8 43 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      المتابعة عبر Google
    </button>
    <div class="modal-switch">
      <span id="authSwitchText">ليس لديك حساب؟</span>
      <button type="button" id="authSwitchBtn">إنشاء حساب</button>
    </div>
  </div>
</div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>

<script src="app.js"></script>
</body>
</html>
