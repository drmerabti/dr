<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">تحويل الأرقام إلى نص — أكاديمية مرابطي</title>
<meta name="description" content="حوّل أي رقم إلى نص مكتوب بالعربية أو الإنجليزية أو الفرنسية، مع إمكانية إضافة اسم العملة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="../../tools.html" class="icon-btn" id="backBtn" aria-label="رجوع للموقع" title="رجوع للموقع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <div class="lang-switch" role="group" aria-label="Language switcher">
    <button type="button" class="lang-btn" data-lang="ar">عربي</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="fr">FR</button>
  </div>
</div>

<main class="wrap">
  <h1 class="title" id="titleText">تحويل الأرقام إلى نص</h1>

  <div class="field">
    <input type="text" inputmode="decimal" id="inputNumber" class="big-input" placeholder="اكتب الرقم هنا... (مثال: 1500.50)" autocomplete="off">
  </div>

  <div class="currency-row">
    <div class="field field-small">
      <label class="mini-label" id="currMainLabel">اسم العملة (اختياري)</label>
      <input type="text" id="currencyMain" class="mini-input" placeholder="مثال: دينار جزائري">
    </div>
    <div class="field field-small">
      <label class="mini-label" id="currSubLabel">اسم الوحدة الفرعية (اختياري)</label>
      <input type="text" id="currencySub" class="mini-input" placeholder="مثال: سنتيم">
    </div>
  </div>

  <button type="button" class="generate-btn" id="convertBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="gen-icon"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    <span id="genLabel">توليد</span>
  </button>

  <div class="field output-wrap">
    <div class="big-output" id="outputText">النص سيظهر هنا...</div>
    <button type="button" class="copy-btn" id="copyBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="copyLabel">نسخ</span>
    </button>
  </div>

  <p class="hint" id="hintText">اكتب أي رقم (صحيح أو عشري) وسيتحول إلى نص مكتوب — أضف اسم العملة إن أردت.</p>
</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

<script src="numToWords.js"></script>
<script src="script.js"></script>
</body>
</html>
