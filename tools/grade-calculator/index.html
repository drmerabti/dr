<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">حاسبة المعدل — أكاديمية مرابطي</title>
<meta name="description" content="احسب معدلك الدراسي بمرونة كاملة، بأي عدد من المواد ومعاملاتك الخاصة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="../../tools.html" class="icon-btn" aria-label="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <div class="lang-switch" role="group">
    <button type="button" class="lang-btn" data-lang="ar">عربي</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="fr">FR</button>
  </div>
</div>

<main class="wrap gc-wrap">
  <h1 class="title" id="pageTitle">حاسبة المعدل</h1>
  <p class="subtitle" id="pageSubtitle">أضف موادك، عدّل المكوّنات والمعاملات كما تريد، وشوف معدلك يتحدّث فورًا</p>

  <div class="gc-components-section">
    <p class="gc-section-label" id="componentsSectionLabel">المكوّنات (تنطبق على كل المواد)</p>
    <div id="componentsRow" class="gc-components-row"></div>
    <button type="button" class="gc-add-component-btn" id="addComponentBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      <span id="addComponentBtnText">إضافة مكوّن</span>
    </button>
  </div>

  <div id="subjectsList" class="gc-subjects-list"></div>

  <button type="button" class="gc-add-subject-btn" id="addSubjectBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span id="addSubjectBtnText">إضافة مادة</span>
  </button>

  <div class="gc-result-card">
    <p class="gc-result-label" id="resultLabel">المعدل العام</p>
    <p class="gc-result-value" id="resultValue">0.00</p>
    <span class="gc-result-rating" id="resultRating"></span>
    <div class="gc-scale-row">
      <span id="scaleLabel">من أصل</span>
      <input type="number" id="scaleInput" class="gc-scale-input" value="20" min="1" step="1">
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

<script src="app.js"></script>
</body>
</html>
