<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="حاسبة الراتب الصافي مع IRG وCNAS وكشف مفصل — أكاديمية مرابطي.">
<title>حاسبة الراتب — د. سفيان مرابطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand" data-i18n="brand">د. سفيان مرابطي</a>
    <div class="topbar-actions">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
      <div class="auth-wrap" id="authWrap">
        <button id="authBtn" class="auth-btn" type="button"></button>
        <div id="authMenu" class="auth-menu hidden"></div>
      </div>
      <button id="langToggle" class="lang-toggle" type="button">EN</button>
    </div>
  </div>
</header>

<nav class="breadcrumbs">
  <a href="../../index.html" class="crumb-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    <span data-i18n="home">الرئيسية</span>
  </a>
</nav>

<main id="app">
  <section class="view">
    <h2 class="view-title tool-title">
      <span class="tool-title-ar">حاسبة الراتب</span>
      <span class="tool-title-en">Salary Calculator</span>
    </h2>

    <div class="salary-layout">

      <!-- ===== نموذج الإدخال ===== -->
      <div class="salary-form no-print">

        <fieldset class="s-panel">
          <legend>معلومات الموظف</legend>
          <div class="s-grid">
            <label>الاسم الكامل <input type="text" id="empName" placeholder="مثال: محمد بن أحمد"></label>
            <label>المنصب <input type="text" id="empJob" placeholder="مثال: أستاذ التعليم الثانوي"></label>
            <label>القطاع
              <select id="empSector">
                <option value="عمومي">عمومي</option>
                <option value="خاص">خاص</option>
              </select>
            </label>
            <label>الشهر <input type="month" id="empMonth"></label>
          </div>
        </fieldset>

        <fieldset class="s-panel">
          <legend>الأجر الأساسي</legend>
          <div class="s-grid">
            <label>الأجر القاعدي (دج) <input type="number" id="baseSalary" min="0" value="0"></label>
            <label>أيام العمل <input type="number" id="workDays" min="0" max="30" value="30"></label>
            <label>الخبرة المهنية IEP (%) <input type="number" id="iepRate" min="0" value="0"></label>
            <label>منحة المنطقة (%) <input type="number" id="zoneRate" min="0" value="0"></label>
          </div>
        </fieldset>

        <fieldset class="s-panel">
          <legend>منح خاضعة للاشتراك والضريبة</legend>
          <div id="allowList1" class="dyn-list"></div>
          <button type="button" class="add-btn" data-list="allowList1">+ إضافة منحة</button>
        </fieldset>

        <fieldset class="s-panel">
          <legend>منح خاضعة للضريبة فقط (سلة / نقل...)</legend>
          <div id="allowList2" class="dyn-list"></div>
          <button type="button" class="add-btn" data-list="allowList2">+ إضافة منحة</button>
        </fieldset>

        <fieldset class="s-panel">
          <legend>المنح العائلية (معفاة)</legend>
          <div class="s-grid">
            <label>عدد الأبناء <input type="number" id="childCount" min="0" value="0"></label>
            <label>المبلغ لكل طفل (دج) <input type="number" id="childAmount" min="0" value="300"></label>
            <label>الأجر الوحيد — زوجة غير عاملة (دج) <input type="number" id="singleSalary" min="0" value="0"></label>
          </div>
        </fieldset>

        <fieldset class="s-panel">
          <legend>الاقتطاعات</legend>
          <div class="s-grid">
            <label>الضمان الاجتماعي CNAS (%) <input type="number" id="cnasRate" min="0" step="0.5" value="9"></label>
            <label>وضعية IRG
              <select id="irgMode">
                <option value="normal">عادي (الجدول الرسمي 2022)</option>
                <option value="special">معاق / متقاعد</option>
                <option value="exempt">معفى</option>
              </select>
            </label>
          </div>
          <div id="dedList" class="dyn-list"></div>
          <button type="button" class="add-btn" data-list="dedList">+ إضافة اقتطاع (تعاضدية، سلفة...)</button>
        </fieldset>

      </div>

      <!-- ===== كشف الراتب ===== -->
      <div class="payslip-wrap">
        <div class="payslip" id="payslip"></div>
        <div class="payslip-actions no-print">
          <button type="button" class="print-btn" id="printBtn">🖨️ طباعة الكشف</button>
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer no-print">
  <p data-i18n="footer_text">© 2026 د. سفيان مرابطي</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="../../app.js"></script>
<script src="app.js"></script>
</body>
</html>
