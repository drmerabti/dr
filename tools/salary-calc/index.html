<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="حاسبة الراتب الصافي بثلاث لغات مع كشف مفصل — أكاديمية مرابطي.">
<title>حاسبة الراتب — د. سفيان مرابطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand" data-i18n="brand">د. سفيان مرابطي</a>
    <div class="topbar-actions">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
      <div class="auth-wrap" id="authWrap">
        <button id="authBtn" class="auth-btn" type="button"></button>
        <div id="authMenu" class="auth-menu hidden"></div>
      </div>
      <button id="langToggle" class="lang-toggle" type="button">EN</button>
    </div>
  </div>
</header>

<nav class="breadcrumbs">
  <a href="../../index.html" class="crumb-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    <span data-i18n="home">الرئيسية</span>
  </a>
</nav>

<main id="app">
  <section class="view">

    <h1 class="tool-big-title" data-k="title">حاسبة الراتب</h1>

    <div class="lang-bar no-print">
      <button type="button" data-lang="ar" class="active">عربي</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>

    <div class="salary-layout">

      <!-- ===== نموذج الإدخال ===== -->
      <div class="salary-form no-print">

        <div class="s-panel">
          <h3 class="s-title" data-k="emp">معلومات الموظف</h3>
          <div class="s-grid">
            <label><span data-k="name">الاسم الكامل</span><input type="text" id="empName"></label>
            <label><span data-k="job">المنصب</span><input type="text" id="empJob"></label>
            <label><span data-k="sector">القطاع</span>
              <select id="empSector">
                <option value="public" data-k="pub">عمومي</option>
                <option value="private" data-k="priv">خاص</option>
              </select>
            </label>
            <label><span data-k="month">الشهر</span><input type="month" id="empMonth"></label>
            <label><span data-k="currency">العملة</span><input type="text" id="curInput" value="دج" placeholder="دج / DA / € / $"></label>
          </div>
        </div>

        <div class="s-panel">
          <h3 class="s-title" data-k="base_t">الأجر الأساسي</h3>
          <div class="s-grid">
            <label><span data-k="base">الأجر القاعدي</span><input type="number" id="baseSalary" min="0" value="0"></label>
            <label><span data-k="days">أيام العمل</span><input type="number" id="workDays" min="0" max="30" value="30"></label>
            <label><span data-k="iep">الخبرة المهنية IEP (%)</span><input type="number" id="iepRate" min="0" value="0"></label>
            <label><span data-k="zone">منحة المنطقة (%)</span><input type="number" id="zoneRate" min="0" value="0"></label>
          </div>
        </div>

        <div class="s-panel">
          <h3 class="s-title" data-k="a1">منح خاضعة للاشتراك والضريبة</h3>
          <div id="allowList1" class="dyn-list"></div>
          <button type="button" class="add-btn" data-list="allowList1" data-k="add_a">+ إضافة منحة</button>
        </div>

        <div class="s-panel">
          <h3 class="s-title" data-k="a2">منح خاضعة للضريبة فقط (سلة / نقل...)</h3>
          <div id="allowList2" class="dyn-list"></div>
          <button type="button" class="add-btn" data-list="allowList2" data-k="add_a">+ إضافة منحة</button>
        </div>

        <div class="s-panel">
          <h3 class="s-title" data-k="fam">المنح العائلية (معفاة)</h3>
          <div class="s-grid">
            <label><span data-k="kids">عدد الأبناء</span><input type="number" id="childCount" min="0" value="0"></label>
            <label><span data-k="kid_amt">المبلغ لكل طفل</span><input type="number" id="childAmount" min="0" value="300"></label>
            <label><span data-k="single">الأجر الوحيد — زوجة غير عاملة</span><input type="number" id="singleSalary" min="0" value="0"></label>
          </div>
        </div>

        <div class="s-panel">
          <h3 class="s-title" data-k="ded">الاقتطاعات</h3>
          <div class="s-grid">
            <label><span data-k="cnas">الضمان الاجتماعي CNAS (%)</span><input type="number" id="cnasRate" min="0" step="0.5" value="9"></label>
            <label><span data-k="irg">وضعية IRG</span>
              <select id="irgMode">
                <option value="normal" data-k="irg_n">عادي (الجدول الجزائري 2022)</option>
                <option value="special" data-k="irg_s">معاق / متقاعد</option>
                <option value="exempt" data-k="irg_e">معفى</option>
                <option value="manual" data-k="irg_m">إدخال يدوي</option>
              </select>
            </label>
            <label id="irgManualTypeWrap" class="hidden"><span data-k="irg_type">طريقة الإدخال اليدوي</span>
              <select id="irgManualType">
                <option value="amount" data-k="irg_t_amt">مبلغ ثابت</option>
                <option value="percent" data-k="irg_t_pct">نسبة % من الوعاء</option>
              </select>
            </label>
            <label id="irgManualWrap" class="hidden"><span data-k="irg_amt">قيمة الضريبة</span><input type="number" id="irgManual" min="0" value="0"></label>

          </div>
          <div id="dedList" class="dyn-list"></div>
          <button type="button" class="add-btn" data-list="dedList" data-k="add_d">+ إضافة اقتطاع (تعاضدية، سلفة...)</button>
        </div>

      </div>

      <!-- ===== كشف الراتب ===== -->
      <div class="payslip-wrap">
        <div class="payslip" id="payslip"></div>
        <div class="payslip-actions no-print">
          <button type="button" class="print-btn" id="printBtn" data-k="print">🖨️ طباعة الكشف</button>
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer no-print">
  <p data-i18n="footer_text">© 2026 د. سفيان مرابطي</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="../../app.js"></script>
<script src="app.js"></script>
</body>
</html>
