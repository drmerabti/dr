<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>محوّل المستندات | د. سفيان مرابطي</title>
<meta name="description" content="ماسح ضوئي، استخراج النص من الصور وملفات PDF، وتحويل الجداول إلى Excel وWord — بالعربية والفرنسية والإنجليزية، مباشرة في متصفحك دون رفع ملفاتك.">
<meta name="theme-color" content="#2F5770">
<link rel="icon" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="/analytics.js"></script>
</head>
<body>

<header class="topbar">
  <a href="../../tools.html" class="icon-btn" id="backBtn" aria-label="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <a href="#home" class="brand" id="brandLink">
    <img src="../../apple-touch-icon.png" alt="">
    <span><b id="brandName">محوّل المستندات</b><small id="brandSub"></small></span>
  </a>
  <div class="top-actions">
    <span class="quota-pill" id="quotaPill"></span>
    <div class="lang-switch" role="group">
      <button type="button" class="lang-btn" data-lang="ar">عربي</button>
      <button type="button" class="lang-btn" data-lang="fr">FR</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="view" class="wrap"></main>

<footer class="foot"><span id="privacyNote"></span></footer>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="pdfIn" accept="application/pdf" hidden>
<input type="file" id="anyIn" accept="image/*,application/pdf" hidden>

<div class="busy" id="busy" hidden>
  <div class="busy-card">
    <div class="spin"></div>
    <b id="busyTxt"></b>
    <div class="bar"><i id="busyBar"></i></div>
    <small id="busySub"></small>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase (compat): لمعرفة اشتراك Pro فقط. الأداة تعمل بدونه. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>

<script src="app.js"></script>
</body>
</html>
