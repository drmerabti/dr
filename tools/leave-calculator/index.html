<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حاسبة العطل وتاريخ الرجوع إلى العمل في الجزائر — أكاديمية مرابطي</title>
<meta name="description" content="احسب تاريخ الرجوع إلى العمل بعد العطلة فورًا، مع احتساب أيام العمل ونهاية الأسبوع والعطل الرسمية الجزائرية والتقويم الهجري، بالعربية والفرنسية والإنجليزية.">
<script src="/analytics.js"></script>
<link rel="icon" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/form-clarity.css">
<link rel="canonical" href="https://merabti.com/tools/leave-calculator/">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6597793750103940"
     crossorigin="anonymous"></script>
</head>
<body>

<!-- بوابة القفل: الأداة "قريبًا" لغير الأدمن -->
<div id="gate" class="gate">
  <div class="gate-card">
    <img src="../../apple-touch-icon.png" alt="" class="gate-logo">
    <div id="gateSpin" class="spin"></div>
    <h1 id="gateTitle"></h1>
    <p id="gateText"></p>
    <a id="gateBtn" class="gate-btn hidden" href="../../index.html"></a>
  </div>
</div>

<!-- الشريط العلوي: الشعار + الأيقونات في نفس الصف، باتجاه ثابت لا يتغير مع اللغة -->
<header class="tb" dir="ltr">
  <a class="tb-logo" href="../../index.html" aria-label="Dr Soufiane Merabti"><img src="../../apple-touch-icon.png" alt="Dr Soufiane Merabti"></a>
  <a class="tb-icon" href="../../tools.html" data-t-title="back">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
  </a>
  <div class="tb-fill"></div>

  <button type="button" class="tb-icon c-blue" data-open="settings" data-t-title="acc_settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg>
  </button>
  <button type="button" class="tb-icon c-purple" data-open="types" data-t-title="acc_types">
    <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg>
  </button>
  <button type="button" class="tb-icon c-teal" data-open="reverse" data-t-title="acc_reverse">
    <svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>
  </button>
  <button type="button" class="tb-icon c-green" data-open="balance" data-t-title="acc_balance">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14"/><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z"/></svg>
  </button>
  <button type="button" class="tb-icon c-orange" data-open="calendar" data-t-title="acc_calendar">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/></svg>
  </button>
  <button type="button" class="tb-icon" id="resetBtn" data-t-title="reset">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
  </button>
  <div class="langs" id="langs" role="group" aria-label="Language">
    <button type="button" data-l="ar">ع</button><button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button>
  </div>
</header>

<main class="wrap" dir="rtl">

  <!-- الواجهة الرئيسية -->
  <section class="card main-card">
    <div class="head tx">
      <h1 data-t="title"></h1>
      <p data-t="subtitle"></p>
    </div>

    <div class="inputs">
      <div class="field">
        <span class="f-label tx" data-t="start"></span>
        <div class="date-box">
          <input type="text" id="startDate" class="big-in date-txt fc-no-tick" dir="ltr" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="DD/MM/YYYY">
          <button type="button" class="date-pick" aria-label="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
          <input type="date" class="date-native" tabindex="-1" aria-hidden="true">
        </div>
        <span class="f-hijri tx" id="startHijri"></span>
      </div>
      <div class="field">
        <span class="f-label tx" data-t="days"></span>
        <div class="stepper">
          <button type="button" class="st-btn" data-step="-1" aria-label="-"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
          <input type="number" id="daysIn" class="big-in" min="1" max="366" inputmode="numeric">
          <button type="button" class="st-btn" data-step="1" aria-label="+"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
        </div>
        <span class="f-hijri tx" id="modeHint"></span>
      </div>
    </div>

    <button type="button" class="summary tx" id="summaryChip" data-open="settings"></button>

    <div class="result" id="result">
      <div class="r-empty tx" id="rEmpty" data-t="empty"></div>
      <div class="r-body hidden" id="rBody">
        <div class="r-label tx" data-t="returnOn"></div>
        <div class="r-day tx" id="rDay"></div>
        <div class="r-date tx" id="rDate"></div>
        <div class="r-hijri tx" id="rHijri"></div>
        <div class="r-shift tx hidden" id="rShift"></div>
        <div class="stats" id="rStats"></div>
        <div class="r-hols tx hidden" id="rHols"></div>
      </div>
    </div>
  </section>

  <!-- الخيارات الإضافية -->
  <section class="accs acc-group" id="accs">

    <div class="acc" style="--sc:#2F6FB0" data-acc="settings">
      <button type="button" class="acc-head">
        <span class="acc-ico c-blue"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg></span>
        <span class="acc-title tx"><b data-t="acc_settings"></b><small data-t="acc_settings_s"></small></span>
        <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-content">
        <div class="opt">
          <div class="opt-label tx" data-t="mode"></div>
          <div class="seg" id="modeSeg">
            <button type="button" data-v="cal" data-t="mode_cal"></button>
            <button type="button" data-v="work" data-t="mode_work"></button>
          </div>
        </div>
        <div class="opt">
          <div class="opt-label tx" data-t="weekend"></div>
          <div class="seg" id="wkSeg">
            <button type="button" data-v="fs" data-t="wk_fs"></button>
            <button type="button" data-v="ss" data-t="wk_ss"></button>
            <button type="button" data-v="f" data-t="wk_f"></button>
          </div>
        </div>
        <div class="opt">
          <label class="switch tx">
            <span data-t="holidays"></span>
            <input type="checkbox" id="holChk"><i></i>
          </label>
          <p class="note-s tx" data-t="holidays_note"></p>
          <div class="hol-list" id="holList"></div>
        </div>
      </div></div></div>
    </div>

    <div class="acc" style="--sc:#7A3FA8" data-acc="types">
      <button type="button" class="acc-head">
        <span class="acc-ico c-purple"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg></span>
        <span class="acc-title tx"><b data-t="acc_types"></b><small data-t="acc_types_s"></small></span>
        <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-content">
        <div class="types" id="typesGrid"></div>
        <p class="note-s tx" id="typeNote"></p>
      </div></div></div>
    </div>

    <div class="acc" style="--sc:#1F8A8A" data-acc="reverse">
      <button type="button" class="acc-head">
        <span class="acc-ico c-teal"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></span>
        <span class="acc-title tx"><b data-t="acc_reverse"></b><small data-t="acc_reverse_s"></small></span>
        <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-content">
        <div class="inputs">
          <div class="field">
            <span class="f-label tx" data-t="start"></span>
            <div class="date-box">
          <input type="text" id="revStart" class="big-in date-txt fc-no-tick" dir="ltr" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="DD/MM/YYYY">
          <button type="button" class="date-pick" aria-label="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
          <input type="date" class="date-native" tabindex="-1" aria-hidden="true">
        </div>
          </div>
          <div class="field">
            <span class="f-label tx" data-t="returnDate"></span>
            <div class="date-box">
          <input type="text" id="revEnd" class="big-in date-txt fc-no-tick" dir="ltr" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="DD/MM/YYYY">
          <button type="button" class="date-pick" aria-label="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
          <input type="date" class="date-native" tabindex="-1" aria-hidden="true">
        </div>
          </div>
        </div>
        <div class="mini-res tx" id="revRes"></div>
      </div></div></div>
    </div>

    <div class="acc" style="--sc:#2E8B57" data-acc="balance">
      <button type="button" class="acc-head">
        <span class="acc-ico c-green"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14"/><path d="M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0z"/></svg></span>
        <span class="acc-title tx"><b data-t="acc_balance"></b><small data-t="acc_balance_s"></small></span>
        <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-content">
        <div class="field">
          <span class="f-label tx" data-t="months"></span>
          <div class="stepper">
            <button type="button" class="st-btn" data-mstep="-1" aria-label="-"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
            <input type="number" id="monthsIn" class="big-in" min="0" max="12" inputmode="numeric">
            <button type="button" class="st-btn" data-mstep="1" aria-label="+"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
          </div>
        </div>
        <div class="mini-res tx" id="balRes"></div>
        <button type="button" class="use-btn" id="useBal"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg><span data-t="useBal"></span></button>
        <p class="note-s tx" data-t="balance_note"></p>
      </div></div></div>
    </div>

    <div class="acc" style="--sc:#D9731A" data-acc="calendar">
      <button type="button" class="acc-head">
        <span class="acc-ico c-orange"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/></svg></span>
        <span class="acc-title tx"><b data-t="acc_calendar"></b><small data-t="acc_calendar_s"></small></span>
        <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="acc-body"><div class="acc-inner"><div class="acc-content">
        <div class="legend tx" id="legend"></div>
        <div class="months" id="months"></div>
      </div></div></div>
    </div>

  </section>
</main>

<div class="toast" id="toast"></div>
