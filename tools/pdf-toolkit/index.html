<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أدوات PDF | Dr Soufiane Merabti</title>
<meta name="description" content="ادمج، قسّم، دوّر، عدّل وحوّل ملفات PDF مباشرة من متصفحك دون رفع أي ملف إلى الخارج.">
<link rel="icon" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="../../index.html"><img src="../../apple-touch-icon.png" alt="Dr Soufiane Merabti" onerror="this.style.visibility='hidden'"></a>
  <nav class="crumb">
    <a href="../../tools.html" id="crumbTools"></a>
    <span class="sl">/</span>
    <span id="crumbRoot"></span>
    <span class="sl">/</span>
    <b id="crumbTool"></b>
  </nav>
  <div class="top-actions">
    <button class="tbtn" id="btnReset" type="button"></button>
    <button class="tbtn primary" id="btnDl" type="button" disabled></button>
    <select class="lang-select" id="langSelect" aria-label="Language">
      <option value="ar">AR</option>
      <option value="en">EN</option>
      <option value="fr">FR</option>
    </select>
    <div class="auth-wrap auth-pending" id="authWrap">
      <button class="auth-btn" id="authBtn" type="button"></button>
      <div class="auth-menu hidden" id="authMenu"></div>
    </div>
  </div>
</header>

<div class="app">
  <aside class="tools" id="tools"></aside>

  <main class="work" id="work">
    <div class="head">
      <div class="ic" id="hIcon"></div>
      <div class="head-txt"><h1 id="hTitle"></h1><p id="hDesc"></p></div>
      <button class="run" id="btnRun" type="button"></button>
    </div>
    <div id="result"></div>
    <div class="drop" id="drop"></div>
    <div class="chips" id="chips"></div>
    <div class="opts" id="opts"></div>
    <section id="pagesWrap">
      <div class="pages-head"><div class="info" id="pInfo"></div><div class="acts" id="pActs"></div></div>
      <div class="pages" id="pages"></div>
    </section>
    <div class="soon-box" id="soonBox" hidden></div>
  </main>

  <section class="preview">
    <div class="pv-head">
      <div class="lbl" id="pvLbl"></div>
      <button class="ib" id="pvPrev" type="button"></button>
      <button class="ib" id="pvNext" type="button"></button>
      <span class="sep"></span>
      <button class="ib" id="zOut" type="button"></button>
      <span class="zl" id="zLbl">100%</span>
      <button class="ib" id="zIn" type="button"></button>
      <button class="ib" id="zFit" type="button"></button>
    </div>
    <div class="pv-stage" id="pvStage">
      <div class="pv-page" id="pvPage" hidden><canvas id="pvCanvas"></canvas><div id="pvOverlay"></div></div>
      <div class="pv-doc" id="pvDoc" hidden></div>
      <div class="pv-empty" id="pvEmpty"><div class="sheet"></div><span id="pvEmptyTxt"></span></div>
    </div>
  </section>
</div>

<input type="file" id="fileIn" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<div class="busy" id="busy"><div class="card"><div class="spin"></div><span id="busyTxt"></span></div></div>
<div class="toast" id="toast"></div>

<!-- Firebase (compat) — تسجيل الدخول اختياري، والأدوات تعمل بدونه -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>

<!-- مكتبات المعالجة — كل شيء يعمل محليًا داخل المتصفح -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="app.js"></script>
</body>
</html>
