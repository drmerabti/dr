<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائج الاستبيان — أكاديمية مرابطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
</head>
<body>

<header class="topbar">
  <a href="../../index.html" class="brand-logo" title="أكاديمية مرابطي">
    <img src="../../apple-touch-icon.png" alt="أكاديمية مرابطي">
  </a>
  <a class="icon-btn" href="index.html" data-tiptext="استبياناتي" aria-label="رجوع">
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </a>
  <span class="tool-name">نتائج الاستبيان</span>
</header>


<main id="app">
  <section class="page-wrap results-page">
    <div id="resultsWrap" class="survey-builder"></div>

    <div id="exportModal" class="sb-modal hidden">
      <div class="sb-modal-box" style="text-align:right;">
        <h3 style="text-align:center;">اختر الأسئلة المراد تصديرها</h3>
        <div id="exportChecklist" style="max-height:300px;overflow:auto;margin:14px 0;display:flex;flex-direction:column;gap:8px;"></div>
        <button id="confirmExportBtn" class="sb-publish-btn">تحميل ملف Excel</button>
        <button id="closeExportModal" class="sb-modal-close" style="display:block;margin:12px auto 0;">إلغاء</button>
      </div>
    </div>
  </section>
</main>


<script src="docx-lite.js"></script>
<script src="results.js"></script>
</body>
</html>
