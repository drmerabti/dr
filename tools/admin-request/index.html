<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد الطلب الإداري — أكاديمية مرابطي</title>
<meta name="description" content="أنشئ طلبًا إداريًا رسميًا بمساعدة الذكاء الاصطناعي، وحمّله PDF أو Word جاهزًا.">
<script src="/analytics.js"></script>
<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a href="../../index.html" class="brand-logo" title="أكاديمية مرابطي">
    <img src="../../apple-touch-icon.png" alt="أكاديمية مرابطي">
  </a>
  <a class="icon-btn back-btn" href="../../tools.html" data-tip="back_tools" aria-label="back">
    <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <span class="tool-name" data-i18n="topbarTitle">مولّد الطلب الإداري</span>
  <div class="topbar-actions">
    <button class="icon-btn" id="btnFullscreen" type="button" data-tip="fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnMine" type="button" data-tip="mine">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="icon-btn" id="saveBtn" type="button" data-tip="save">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
    </button>
    <button class="icon-btn" id="printBtn" type="button" data-tip="print">
      <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H4v-7h16v7h-3"/><path d="M7 14h10v6H7z"/></svg>
    </button>
    <button class="icon-btn word" id="wordBtn" type="button" data-tip="word">
      <span>W</span>
    </button>
    <button class="icon-btn pdf" id="downloadPdfBtn" type="button" data-tip="pdf">
      <span>PDF</span>
    </button>
    <div class="lang-wrap">
      <button class="lang-toggle" id="langToggle" type="button">AR</button>
      <div class="lang-menu hidden" id="langMenu">
        <button type="button" class="lang-btn" data-lang="ar">العربية</button>
        <button type="button" class="lang-btn" data-lang="fr">Français</button>
        <button type="button" class="lang-btn" data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="workspace" id="workspace">
  <aside class="panel" id="panel">
    <button class="gallery-open" id="btnGallery" type="button">
      <span class="go-thumb" id="currentThumb"></span>
      <span class="go-text">
        <strong data-i18n="gallery">معرض النماذج</strong>
        <small id="currentTplName"></small>
      </span>
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>

    <div class="accordion" id="accordion">

      <!-- 1. Request type & template -->
      <section class="acc" data-sec="type" style="--sc:#2F6F9F">
        <button type="button" class="acc-head"><span class="acc-num">1</span>
          <span class="acc-title"><b data-i18n="sec_type">نوع الطلب والنموذج</b><small data-sum="type"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label data-i18n="requestType">نوع الطلب</label>
            <div class="type-grid" id="typeGrid"></div>
            <p class="hint" data-i18n="typeHint"></p>
          </div>
          <div class="field">
            <label data-i18n="design">التصميم</label>
            <div class="tpl-strip" id="designStrip"></div>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <!-- 2. Sender -->
      <section class="acc" data-sec="sender" style="--sc:#16A34A">
        <button type="button" class="acc-head"><span class="acc-num">2</span>
          <span class="acc-title"><b data-i18n="sec_sender">معلومات المرسل</b><small data-sum="sender"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field-row2">
            <div class="field">
              <label for="fFirstName" data-i18n="firstNameLbl">الاسم</label>
              <input type="text" id="fFirstName" data-i18n-placeholder="firstNamePh">
            </div>
            <div class="field">
              <label for="fLastName" data-i18n="lastNameLbl">اللقب</label>
              <input type="text" id="fLastName" data-i18n-placeholder="lastNamePh">
            </div>
          </div>
          <div class="field-row2">
            <div class="field">
              <label for="fPhone" data-i18n="phoneLbl">الهاتف</label>
              <input type="tel" id="fPhone" class="ltr-input" placeholder="0555 12 34 56">
            </div>
            <div class="field">
              <label for="fEmail" data-i18n="emailLbl">البريد الإلكتروني</label>
              <input type="email" id="fEmail" class="ltr-input" placeholder="example@email.com">
            </div>
          </div>
          <div class="field">
            <label data-i18n="extraCardTitle">معلومات إضافية</label>
            <div id="extraFieldsList" class="dyn-list"></div>
            <button type="button" class="add-btn" id="addExtraBtn">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addExtra">إضافة سطر</span>
            </button>
            <p class="hint" data-i18n="extraHint"></p>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <!-- 3. Recipient -->
      <section class="acc" data-sec="to" style="--sc:#D97706">
        <button type="button" class="acc-head"><span class="acc-num">3</span>
          <span class="acc-title"><b data-i18n="sec_to">الجهة المرسل إليها</b><small data-sum="to"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="fAddressedTo" data-i18n="addressedToLbl">موجّه إلى</label>
            <input type="text" id="fAddressedTo" data-i18n-placeholder="addressedToPh">
            <div class="chips suggest" id="toSuggest"></div>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <!-- 4. Subject & body -->
      <section class="acc" data-sec="subject" style="--sc:#7C3AED">
        <button type="button" class="acc-head"><span class="acc-num">4</span>
          <span class="acc-title"><b data-i18n="sec_subject">الموضوع ونص الطلب</b><small data-sum="subject"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="fSubjectTitle" data-i18n="subjectLbl">الموضوع</label>
            <input type="text" id="fSubjectTitle" data-i18n-placeholder="subjectTitlePh">
          </div>
          <div class="field ai-box">
            <label for="fRequestSubject"><span data-i18n="requestCardTitle">فكرة الطلب</span> <span class="badge-ai">AI</span></label>
            <textarea id="fRequestSubject" rows="3" data-i18n-placeholder="requestPh"></textarea>
            <div class="ai-actions-row">
              <button type="button" class="soft-btn primary" id="generateBtn">
                <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>
                <span id="generateBtnText" data-i18n="generateBtnText">توليد الطلب</span>
              </button>
              <button type="button" class="soft-btn" id="rephraseBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                <span data-i18n="rephraseBtnLabel">تغيير الصيغة</span>
              </button>
              <button type="button" class="soft-btn" id="shortenBtn" disabled>
                <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h6"/></svg>
                <span data-i18n="shortenBtnLabel">اختصار الطلب</span>
              </button>
            </div>
            <p class="usage-indicator" id="usageIndicator"></p>
            <p class="ai-error hidden" id="aiError"></p>
          </div>
          <div class="field">
            <label for="fBody" data-i18n="bodyLbl">نص الطلب</label>
            <textarea id="fBody" class="body-textarea" data-i18n-placeholder="bodyPlaceholder"></textarea>
            <p class="hint" data-i18n="bodyHint"></p>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <!-- 5. Attachments -->
      <section class="acc" data-sec="attach" style="--sc:#0891B2">
        <button type="button" class="acc-head"><span class="acc-num">5</span>
          <span class="acc-title"><b data-i18n="sec_attach">المرفقات</b><small data-sum="attach"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label data-i18n="attachLbl">الوثائق المرفقة بالطلب</label>
            <div id="attachList" class="dyn-list"></div>
            <button type="button" class="add-btn" id="addAttachBtn">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addAttach">إضافة مرفق</span>
            </button>
            <p class="hint" data-i18n="attachHint"></p>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <!-- 6. Signature & date -->
      <section class="acc" data-sec="sign" style="--sc:#DB2777">
        <button type="button" class="acc-head"><span class="acc-num">6</span>
          <span class="acc-title"><b data-i18n="sec_sign">التوقيع والتاريخ</b><small data-sum="sign"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field-row2">
            <div class="field">
              <label for="fDate" data-i18n="dateLbl">التاريخ</label>
              <input type="date" id="fDate">
            </div>
            <div class="field">
              <label for="fPlace" data-i18n="placeLbl">المكان (اختياري)</label>
              <input type="text" id="fPlace" data-i18n-placeholder="placePh">
            </div>
          </div>
          <div class="field">
            <label data-i18n="stampCardTitle">الختم والتوقيع (اختياري)</label>
            <div class="upload-box" id="stampBox">
              <input type="file" id="stampInput" accept="image/*" hidden>
              <div class="upload-placeholder" id="stampPlaceholder">
                <svg viewBox="0 0 24 24"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                <span data-i18n="uploadStamp">رفع صورة الختم أو التوقيع</span>
              </div>
              <img id="stampPreview" class="upload-img hidden" alt="">
              <button type="button" class="upload-remove hidden" id="stampRemove" data-tip="remove"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <!-- 7. Formatting -->
      <section class="acc" data-sec="style" style="--sc:#64748B">
        <button type="button" class="acc-head"><span class="acc-num">7</span>
          <span class="acc-title"><b data-i18n="sec_style">التنسيق والترويسة</b><small data-sum="style"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label data-i18n="fontSectionLabel">الخط</label>
            <div class="font-grid" id="fontFilter"></div>
          </div>
          <div class="field">
            <label data-i18n="fontSizeLbl">حجم خط الطلب</label>
            <div class="size-ctl" role="group">
              <button type="button" id="fsDown" data-tip="fsDown" dir="ltr">A−</button>
              <span class="size-val" id="fsVal" dir="ltr">100%</span>
              <button type="button" id="fsUp" data-tip="fsUp" dir="ltr">A+</button>
              <button type="button" id="fsReset" data-tip="fsReset"><svg viewBox="0 0 24 24"><path d="M4 4v6h6M4 10a8 8 0 1 1 2 6"/></svg></button>
            </div>
            <p class="hint" data-i18n="fontSizeHint"></p>
            <div class="size-warn hidden" id="fsWarn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span data-i18n="overflowWarn"></span></div>
          </div>
          <div class="field">
            <label data-i18n="companyCardTitle">صورة الرأس / الترويسة (اختياري)</label>
            <div class="upload-box wide" id="companyLogoBox">
              <input type="file" id="companyLogoInput" accept="image/*" hidden>
              <div class="upload-placeholder" id="companyLogoPlaceholder">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 15l-4.5-4.5a2 2 0 0 0-2.8 0L7 17"/></svg>
                <span data-i18n="uploadHeader">رفع صورة الترويسة</span>
              </div>
              <img id="companyLogoPreview" class="upload-img hidden" alt="">
              <button type="button" class="upload-remove hidden" id="companyLogoRemove" data-tip="remove"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div>
            <p class="hint" data-i18n="headerHint"></p>
          </div>
          <div class="field">
            <button type="button" class="soft-btn danger" id="clearAllBtn">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
              <span data-i18n="clearAllText">تفريغ الخانات</span>
            </button>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="done">تم</span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
        </div></div></div>
      </section>
    </div>
  </aside>

  <button class="panel-toggle" id="panelToggle" type="button" data-tip="toggle_panel">
    <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
  </button>

  <main class="stage" id="stage">
    <div class="stage-bar">
      <div class="zoom" id="zoomCtl">
        <button type="button" id="zoomOut" aria-label="-"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <span id="zoomVal">100%</span>
        <button type="button" id="zoomIn" aria-label="+"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
        <button type="button" id="zoomFit" data-tip="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="page-warn hidden" id="pageWarn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span data-i18n="overflowShort"></span></div>
    </div>

    <div class="flat-view" id="flatView">
      <div class="sheet-holder" id="sheetHolder">
        <div class="request-page d-classic" id="requestPage">
          <div class="req-stripe"></div>
          <div class="req-header hidden" id="reqHeader" data-sec="style">
            <img id="reqCompanyLogo" class="req-letterhead-img hidden" alt="">
            <button type="button" class="req-remove-btn" id="removeHeaderBtn">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="req-top">
            <div class="req-sender-block" data-sec="sender">
              <p><span class="req-label" id="reqLabelName">الاسم: </span><span class="req-value" id="reqSenderFirst"></span></p>
              <p><span class="req-label" id="reqLabelLastName">اللقب: </span><span class="req-value" id="reqSenderLast"></span></p>
              <p><span class="req-label" id="reqLabelPhone">الهاتف: </span><span class="req-value req-ltr" id="reqSenderPhone"></span></p>
              <p><span class="req-label" id="reqLabelEmail">البريد: </span><span class="req-value req-ltr" id="reqSenderEmail"></span></p>
              <div id="reqExtraInfo"></div>
            </div>
            <p class="req-date" id="reqDate" data-sec="sign"></p>
          </div>

          <p class="req-addressed" id="reqAddressed" data-sec="to"></p>

          <p class="req-subject" data-sec="subject"><span class="req-label" id="reqLabelSubject">الموضوع: </span><span class="req-value" id="reqSubjectValue"></span></p>

          <div class="req-body" id="reqBody" contenteditable="true" data-sec="subject"></div>

          <div class="req-attach hidden" id="reqAttach" data-sec="attach">
            <p class="req-label" id="reqLabelAttach">المرفقات:</p>
            <div id="reqAttachList"></div>
          </div>

          <div class="req-signature" data-sec="sign">
            <p class="req-signature-caption" id="reqSignatureCaption"></p>
            <img id="reqStamp" class="req-stamp-img hidden" alt="">
            <button type="button" class="req-remove-btn hidden" id="removeStampBtn">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Templates gallery -->
<div class="gallery hidden" id="gallery" role="dialog" aria-modal="true">
  <div class="gallery-box">
    <div class="gallery-head">
      <h2 data-i18n="gallery">معرض النماذج</h2>
      <div class="chips" id="gTabs">
        <button type="button" class="chip on" data-tab="types" data-i18n="g_types">أنواع الطلبات</button>
        <button type="button" class="chip" data-tab="designs" data-i18n="g_designs">التصاميم</button>
      </div>
      <div class="g-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input type="text" id="gSearch" data-i18n-placeholder="search">
      </div>
      <button class="icon-btn" id="gClose" type="button" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="g-grid" id="gGrid"></div>
  </div>
</div>

<!-- My requests -->
<div class="gallery hidden" id="mine" role="dialog" aria-modal="true">
  <div class="gallery-box">
    <div class="gallery-head">
      <h2 data-i18n="mine">طلباتي</h2>
      <div class="chips" id="mineTabs">
        <button type="button" class="chip on" data-src="all" data-i18n="src_all">الكل</button>
        <button type="button" class="chip" data-src="local" data-i18n="src_local">على الجهاز</button>
        <button type="button" class="chip" data-src="cloud" data-i18n="src_cloud">في حسابي</button>
      </div>
      <button class="icon-btn" id="mClose" type="button" aria-label="close" style="margin-inline-start:auto"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="mine-login hidden" id="mineLogin">
      <span data-i18n="mine_login_hint"></span>
      <button type="button" class="soft-btn primary" id="mineLoginBtn" data-i18n="sign_in">تسجيل الدخول</button>
    </div>
    <div class="g-grid mine-grid" id="mGrid"></div>
  </div>
</div>

<!-- Login prompt -->
<div class="gallery hidden" id="login" role="dialog" aria-modal="true">
  <div class="login-box">
    <div class="login-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
    <h3 id="loginTitle" data-i18n="login_title">سجّل دخولك</h3>
    <p id="loginText" data-i18n="login_text"></p>
    <button type="button" class="login-google" id="loginGoogle">
      <svg viewBox="0 0 48 48" style="stroke:none"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span data-i18n="googleBtn">المتابعة عبر Google</span>
    </button>
    <div class="auth-divider"><span data-i18n="or">أو</span></div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab on" data-mode="login" id="tabLogin" data-i18n="tabLogin">تسجيل الدخول</button>
      <button type="button" class="auth-tab" data-mode="signup" id="tabSignup" data-i18n="tabSignup">إنشاء حساب</button>
    </div>
    <form id="authCardForm" class="auth-form">
      <input type="text" id="acName" class="hidden" data-i18n-placeholder="namePh">
      <input type="email" id="acEmail" required class="ltr-input" data-i18n-placeholder="emailPh">
      <input type="password" id="acPassword" required minlength="6" class="ltr-input" data-i18n-placeholder="passwordPh">
      <p class="auth-card-error hidden" id="authCardError"></p>
      <button type="submit" class="soft-btn primary" id="acSubmitBtn" data-i18n="loginBtn">تسجيل الدخول</button>
    </form>
    <button type="button" class="login-cancel" id="loginCancel" data-i18n="cancel">إلغاء</button>
  </div>
</div>

<!-- Confirm dialog -->
<div class="gallery hidden" id="confirmDlg" role="dialog" aria-modal="true">
  <div class="login-box">
    <div class="login-ico warn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
    <p id="confirmText"></p>
    <div class="dlg-actions">
      <button type="button" class="soft-btn" id="confirmNo" data-i18n="cancel">إلغاء</button>
      <button type="button" class="soft-btn danger solid" id="confirmYes" data-i18n="confirm_ok">تأكيد</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="print-root" id="printRoot" aria-hidden="true"></div>
