<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">مولّد صفحات الغلاف — أكاديمية مرابطي</title>
<meta name="description" content="أنشئ صفحة غلاف احترافية لمذكرتك أو تقريرك، بعدة قوالب وإطارات اختيارية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;500;700;900&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="../../tools.html" class="icon-btn" id="backBtn" aria-label="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <span class="topbar-title" id="topbarTitle">مولّد صفحات الغلاف</span>
  <div class="topbar-actions">
    <div class="lang-switch" role="group">
      <button type="button" class="lang-btn" data-lang="ar">عربي</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="fr">FR</button>
    </div>
  </div>
</div>

<main class="wrap">

  <section id="loadingScreen" class="screen loading-screen">
    <div class="loading-spinner"></div>
  </section>

  <section id="lockedScreen" class="screen hidden">
    <div class="locked-hero">
      <div class="locked-icon">🔒</div>
      <h1 id="lockedTitle">سجّل دخولك لاستخدام مولّد صفحات الغلاف</h1>
      <p id="lockedSub">هذه الأداة متاحة للمستخدمين المسجّلين فقط.</p>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login" id="tabLogin">تسجيل الدخول</button>
        <button type="button" class="auth-tab" data-mode="signup" id="tabSignup">إنشاء حساب</button>
      </div>
      <p class="auth-card-error hidden" id="authCardError"></p>
      <form id="authCardForm">
        <input type="text" id="acName" class="cv-input hidden" placeholder="الاسم الكامل">
        <input type="email" id="acEmail" class="cv-input" required placeholder="البريد الإلكتروني">
        <input type="password" id="acPassword" class="cv-input" required minlength="6" placeholder="كلمة المرور">
        <button type="submit" class="btn btn-primary btn-block" id="acSubmitBtn">تسجيل الدخول</button>
      </form>
      <div class="auth-divider">أو</div>
      <button type="button" class="auth-google-btn" id="acGoogleBtn">
        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.3 0 10.2-2 13.9-5.3l-6.4-5.4C29.3 36 26.8 37 24 37c-5.2 0-9.6-3.1-11.4-7.6l-6.6 5.1C9.8 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.4 5.4C40.5 36.6 43 30.8 43 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
        <span>المتابعة عبر Google</span>
      </button>
    </div>
  </section>

  <section id="editorScreen" class="screen hidden">
    <h1 class="tool-page-title-big" id="toolTitle">مولّد صفحات الغلاف</h1>

    <p class="sub-section-label" id="frameSectionLabel">الإطار (اختياري)</p>
    <div class="theme-filter centered-filter" id="frameFilter"></div>

    <p class="sub-section-label" id="fontSectionLabel">الخط</p>
    <div class="theme-filter centered-filter font-filter" id="fontFilter"></div>

    <p class="sub-section-label" id="templateSectionLabel">القالب</p>
    <div class="theme-filter centered-filter template-filter" id="templateFilter"></div>

    <div class="editor-grid">
      <div class="editor-form">

        <div class="form-card">
          <h2 class="form-card-title" id="logosCardTitle">الشعارات</h2>
          <div class="logo-row">
            <div class="logo-upload-box" id="logo1Box">
              <img id="logo1Preview" class="logo-preview" alt="">
            </div>
            <div class="logo-upload-box hidden" id="logo2Box">
              <img id="logo2Preview" class="logo-preview hidden" alt="">
              <span class="logo-placeholder" id="logo2Placeholder">🖼️</span>
            </div>
            <input type="file" id="logo1Input" accept="image/*" hidden>
            <input type="file" id="logo2Input" accept="image/*" hidden>
          </div>
        </div>

        <div class="form-card" id="academicTextCard">
          <h2 class="form-card-title" id="textCardTitle">النصوص</h2>
          <input type="text" id="fCountry" class="cv-input" placeholder="الجمهورية / الدولة">
          <input type="text" id="fMinistry" class="cv-input" placeholder="الوزارة">
          <input type="text" id="fUni" class="cv-input" placeholder="اسم الجامعة">
          <input type="text" id="fFaculty" class="cv-input" placeholder="الكلية">
          <input type="text" id="fDegreeType" class="cv-input" placeholder="نوع الشهادة (أطروحة / مذكرة تخرج...)">
          <input type="text" id="fSpecialty" class="cv-input" placeholder="التخصص (اختياري)">
          <input type="text" id="fMainTitle" class="cv-input" placeholder="عنوان المشروع / الأطروحة">
          <input type="text" id="fDate" class="cv-input" placeholder="السنة الجامعية">
        </div>

        <div class="form-card hidden" id="instTextCard">
          <h2 class="form-card-title" id="instTextCardTitle">النصوص</h2>
          <input type="text" id="fCompany" class="cv-input" placeholder="اسم الشركة/المؤسسة">
          <input type="text" id="fCategoryLabel" class="cv-input" placeholder="تصنيف التقرير (مثال: التقرير السنوي)">
          <input type="text" id="fInstTitle" class="cv-input" placeholder="عنوان التقرير الكامل">
          <input type="text" id="fPreparedBy" class="cv-input" placeholder="إعداد: (جهة الإعداد)">
          <input type="text" id="fWebsite" class="cv-input" placeholder="الموقع الإلكتروني">
          <input type="text" id="fCountrySimple" class="cv-input" placeholder="البلد">
        </div>

        <div class="form-card" id="studentsCard">
          <h2 class="form-card-title" id="studentsCardTitle">إعداد الطالب</h2>
          <div id="studentsList"></div>
        </div>

        <div class="form-card hidden" id="supervisorCard">
          <h2 class="form-card-title" id="supervisorCardTitle">تحت إشراف</h2>
          <input type="text" id="fSupervisor" class="cv-input" placeholder="اسم المشرف">
        </div>

        <div class="form-card hidden" id="juryCard">
          <div class="form-card-head">
            <h2 class="form-card-title" id="juryCardTitle">لجنة المناقشة</h2>
            <button type="button" class="add-row-btn" id="addJuryBtn">+ <span id="addJuryText">إضافة</span></button>
          </div>
          <div id="juryList"></div>
        </div>

        <button type="button" class="btn btn-primary btn-block" id="downloadPdfBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M5 21h14"/></svg>
          <span id="downloadBtnText">تحميل PDF</span>
        </button>
      </div>

      <div class="editor-preview">
        <div class="cover-page" id="coverPage">
          <img class="cover-frame-img hidden" id="frameImg" alt="">

          <!-- ACADEMIC STRUCTURE -->
          <div class="tpl-academic" id="tplAcademic">
            <p class="ac-country" id="acCountry"></p>
            <p class="ac-ministry" id="acMinistry"></p>
            <div class="ac-divider"></div>
            <p class="ac-uni" id="acUni"></p>
            <p class="ac-faculty" id="acFaculty"></p>
            <div class="ac-logos-row" id="acLogosRow">
              <img class="ac-logo" id="acLogo1" alt="">
              <img class="ac-logo hidden" id="acLogo2" alt="">
            </div>
            <div class="ac-middle" id="acMiddle">
              <div class="ac-title-block">
                <p class="ac-degree-type" id="acDegreeType"></p>
                <p class="ac-specialty" id="acSpecialty"></p>
                <div class="ac-title-box"><p class="ac-main-title" id="acMainTitle"></p></div>
              </div>
              <div class="ac-presenter-block" id="acPresenterBlock">
                <p class="ac-presented-label" id="acPresentedLabel"></p>
                <p class="ac-presenter-name" id="acPresenterName"></p>
              </div>
              <div class="ac-side-by-side hidden" id="acSideBySide">
                <div>
                  <p class="ac-presented-label" id="acStudentLabel2"></p>
                  <p class="ac-presenter-name" id="acPresenterName2"></p>
                </div>
                <div>
                  <p class="ac-presented-label" id="acSupervisorLabel"></p>
                  <p class="ac-presenter-name" id="acSupervisorName"></p>
                </div>
              </div>
              <div class="ac-jury-table hidden" id="acJuryTable"></div>
            </div>
            <p class="ac-date" id="acDate"></p>
          </div>

          <!-- INSTITUTIONAL STRUCTURE -->
          <div class="tpl-institutional hidden" id="tplInstitutional">
            <div class="inst-top">
              <div class="inst-logo-box"><img id="instLogo" class="inst-logo" alt=""></div>
              <p class="inst-company" id="instCompany"></p>
            </div>
            <div class="inst-middle">
              <p class="inst-category" id="instCategory"></p>
              <p class="inst-title" id="instTitle"></p>
              <div class="inst-line"></div>
              <p class="inst-prepared" id="instPrepared"></p>
            </div>
            <div class="inst-footer">
              <span id="instWebsite"></span>
              <span id="instCountry"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>© 2026 د. سفيان مرابطي</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
