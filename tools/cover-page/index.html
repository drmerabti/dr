<body>

<header class="topbar">
  <a href="../../index.html" class="brand-logo" title="أكاديمية مرابطي">
    <img src="../../apple-touch-icon.png" alt="أكاديمية مرابطي">
  </a>
  <a class="icon-btn back-btn" href="../../tools.html" data-tip="back_tools" aria-label="back">
    <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <span class="tool-name" data-i18n="topbarTitle">مولّد صفحات الغلاف</span>
  <div class="topbar-actions">
    <button class="icon-btn" id="btnFullscreen" type="button" data-tip="fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnMine" type="button" data-tip="mine">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="icon-btn" id="saveBtn" type="button" data-tip="save">
      <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
    </button>
    <button class="icon-btn" id="printBtn" type="button" data-tip="print">
      <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H4v-7h16v7h-3"/><path d="M7 14h10v6H7z"/></svg>
    </button>
    <button class="icon-btn word" id="wordBtn" type="button" data-tip="word">
      <span>W</span>
    </button>
    <button class="icon-btn pdf" id="downloadPdfBtn" type="button" data-tip="pdf">
      <span>PDF</span>
    </button>
    <button class="icon-btn png" id="pngBtn" type="button" data-tip="png">
      <span>PNG</span>
    </button>
    <div class="lang-wrap">
      <button class="lang-toggle" id="langToggle" type="button">AR</button>
      <div class="lang-menu hidden" id="langMenu">
        <button type="button" class="lang-btn" data-lang="ar">العربية</button>
        <button type="button" class="lang-btn" data-lang="fr">Français</button>
        <button type="button" class="lang-btn" data-lang="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="workspace" id="workspace">
  <aside class="panel" id="panel">
    <button class="gallery-open" id="btnGallery" type="button">
      <span class="go-thumb" id="currentThumb"></span>
      <span class="go-text">
        <strong data-i18n="gallery">معرض التصاميم</strong>
        <small id="currentTplName"></small>
      </span>
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>

    <div class="accordion" id="accordion">
      <section class="acc" data-sec="design" style="--sc:#2F6F9F">
        <button type="button" class="acc-head"><span class="acc-num">1</span>
          <span class="acc-title"><b data-i18n="sec_design">التصميم والتنسيق</b><small data-sum="design"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label data-i18n="designLbl">التصميم</label>
            <div class="tpl-strip" id="designStrip"></div>
            <p class="hint" data-i18n="designHint"></p>
          </div>
          <div class="field">
            <label data-i18n="colorLbl">اللون الرئيسي</label>
            <div class="swatches" id="colorSwatches"></div>
          </div>
          <div class="field">
            <label data-i18n="fontSectionLabel">الخط</label>
            <div class="font-grid" id="fontFilter"></div>
          </div>
          <div class="field">
            <label data-i18n="fontSizeLbl">حجم الخط</label>
            <div class="size-ctl" role="group">
              <button type="button" id="fsDown" data-tip="fsDown" dir="ltr">A−</button>
              <span class="size-val" id="fsVal" dir="ltr">100%</span>
              <button type="button" id="fsUp" data-tip="fsUp" dir="ltr">A+</button>
              <button type="button" id="fsReset" data-tip="fsReset"><svg viewBox="0 0 24 24"><path d="M4 4v6h6M4 10a8 8 0 1 1 2 6"/></svg></button>
            </div>
            <p class="hint" data-i18n="fontSizeHint"></p>
            <div class="size-warn hidden" id="fsWarn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span data-i18n="overflowWarn"></span></div>
          </div>
          <div class="field">
            <label data-i18n="bgLbl">إطار أو خلفية من جهازك (اختياري)</label>
            <div class="upload-box wide" id="bgBox">
              <input type="file" id="bgInput" accept="image/*" hidden>
              <div class="upload-placeholder" id="bgPlaceholder"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 15l-4.5-4.5a2 2 0 0 0-2.8 0L7 17"/></svg><span data-i18n="uploadBg">رفع صورة بحجم الصفحة</span></div>
              <img id="bgPreview" class="upload-img hidden" alt="">
              <button type="button" class="upload-remove hidden" id="bgRemove" data-tip="remove"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div>
            <p class="hint" data-i18n="bgHint"></p>
          </div>
          <div class="field">
            <button type="button" class="soft-btn danger" id="clearAllBtn">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
              <span data-i18n="clearAllText">تفريغ الخانات</span>
            </button>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <section class="acc" data-sec="inst" style="--sc:#0F766E">
        <button type="button" class="acc-head"><span class="acc-num">2</span>
          <span class="acc-title"><b data-i18n="sec_inst">المؤسسة والشعار</b><small data-sum="inst"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="f_country" data-i18n="countryLbl">الدولة</label>
            <input type="text" id="f_country" data-f="country">
          </div>
          <div class="field">
            <label for="f_ministry" data-i18n="ministryLbl">الوزارة</label>
            <input type="text" id="f_ministry" data-f="ministry">
          </div>
          <div class="field">
            <label for="f_uni" data-i18n="uniLbl">الجامعة أو المدرسة أو المؤسسة</label>
            <input type="text" id="f_uni" data-f="uni">
          </div>
          <div class="field-row2">
          <div class="field">
            <label for="f_faculty" data-i18n="facultyLbl">الكلية أو المعهد</label>
            <input type="text" id="f_faculty" data-f="faculty">
          </div>
          <div class="field">
            <label for="f_dept" data-i18n="deptLbl">القسم</label>
            <input type="text" id="f_dept" data-f="dept">
          </div>
          </div>
          <div class="field">
            <label data-i18n="logosLbl">الشعاران</label>
            <div class="logo-pair">
              <div><small data-i18n="logo1">الشعار الأول</small><div class="upload-box" id="logo1Box">
              <input type="file" id="logo1Input" accept="image/*" hidden>
              <div class="upload-placeholder" id="logo1Placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 15l-4.5-4.5a2 2 0 0 0-2.8 0L7 17"/></svg><span data-i18n="uploadLogo">رفع شعار</span></div>
              <img id="logo1Preview" class="upload-img hidden" alt="">
              <button type="button" class="upload-remove hidden" id="logo1Remove" data-tip="remove"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div></div>
              <div><small data-i18n="logo2">الشعار الثاني (اختياري)</small><div class="upload-box" id="logo2Box">
              <input type="file" id="logo2Input" accept="image/*" hidden>
              <div class="upload-placeholder" id="logo2Placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 15l-4.5-4.5a2 2 0 0 0-2.8 0L7 17"/></svg><span data-i18n="uploadLogo">رفع شعار</span></div>
              <img id="logo2Preview" class="upload-img hidden" alt="">
              <button type="button" class="upload-remove hidden" id="logo2Remove" data-tip="remove"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
            </div></div>
            </div>
          </div>
          <div class="field">
            <label for="f_host" data-i18n="hostLbl">مؤسسة الاستقبال / التربص (اختياري)</label>
            <input type="text" id="f_host" data-f="host">
          </div>
          <div class="field">
            <label for="f_website" data-i18n="websiteLbl">الموقع الإلكتروني</label>
            <input type="text" id="f_website" data-f="website">
          </div>
          <p class="hint sec-hint" data-i18n="instHint"></p>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <section class="acc" data-sec="work" style="--sc:#7C3AED">
        <button type="button" class="acc-head"><span class="acc-num">3</span>
          <span class="acc-title"><b data-i18n="sec_work">نوع العمل والعنوان</b><small data-sum="work"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="f_workType" data-i18n="workTypeLbl">نوع العمل</label>
            <input type="text" id="f_workType" data-f="workType">
            <div class="chips suggest" id="typeSuggest"></div>
          </div>
          <div class="field">
            <label for="f_title" data-i18n="titleLbl">العنوان</label>
            <textarea id="f_title" data-f="title" rows="2"></textarea>
          </div>
          <div class="field">
            <label for="f_subtitle" data-i18n="subtitleLbl">عنوان فرعي (اختياري)</label>
            <input type="text" id="f_subtitle" data-f="subtitle">
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <section class="acc" data-sec="team" style="--sc:#16A34A">
        <button type="button" class="acc-head"><span class="acc-num">4</span>
          <span class="acc-title"><b data-i18n="sec_team">المُعِدّ أو فريق العمل</b><small data-sum="team"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label data-i18n="teamLbl">أسماء المُعِدّين</label>
            <div id="studentsList" class="dyn-list"></div>
            <button type="button" class="add-btn" id="addStudentBtn">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addStudent">إضافة اسم</span>
            </button>
            <p class="hint" data-i18n="teamHint"></p>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <section class="acc" data-sec="sup" style="--sc:#D97706">
        <button type="button" class="acc-head"><span class="acc-num">5</span>
          <span class="acc-title"><b data-i18n="sec_sup">الأستاذ أو المؤطر</b><small data-sum="sup"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="f_supervisor" data-i18n="supLbl">الأستاذ المؤطر أو المشرف</label>
            <input type="text" id="f_supervisor" data-f="supervisor">
          </div>
          <div class="field">
            <label for="f_coSup" data-i18n="coSupLbl">مؤطر مساعد (اختياري)</label>
            <input type="text" id="f_coSup" data-f="coSup">
          </div>
          <div class="field">
            <label class="switch-row" for="f_juryOn">
              <input type="checkbox" id="f_juryOn">
              <span class="switch"></span>
              <span data-i18n="juryToggle">إظهار لجنة المناقشة</span>
            </label>
          </div>
          <div class="field" id="juryField">
            <label data-i18n="juryLbl">لجنة المناقشة</label>
            <div id="juryList" class="items-list"></div>
            <button type="button" class="add-btn" id="addJurorBtn">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addJuror">إضافة عضو</span>
            </button>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <section class="acc" data-sec="level" style="--sc:#0891B2">
        <button type="button" class="acc-head"><span class="acc-num">6</span>
          <span class="acc-title"><b data-i18n="sec_level">المستوى والتخصص</b><small data-sum="level"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="f_level" data-i18n="levelLbl">المستوى</label>
            <input type="text" id="f_level" data-f="level">
          </div>
          <div class="field">
            <label for="f_specialty" data-i18n="specialtyLbl">التخصص أو المادة</label>
            <input type="text" id="f_specialty" data-f="specialty">
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="next">التالي</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        </div></div></div>
      </section>

      <section class="acc" data-sec="year" style="--sc:#DB2777">
        <button type="button" class="acc-head"><span class="acc-num">7</span>
          <span class="acc-title"><b data-i18n="sec_year">السنة والتاريخ</b><small data-sum="year"></small></span>
          <svg class="acc-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="acc-body"><div class="acc-inner"><div class="acc-content">
          <div class="field">
            <label for="f_year" data-i18n="yearLbl">السنة الجامعية أو الدراسية</label>
            <input type="text" id="f_year" data-f="year">
          </div>
          <div class="field-row2">
          <div class="field">
            <label for="f_place" data-i18n="placeLbl">المكان (اختياري)</label>
            <input type="text" id="f_place" data-f="place">
          </div>
          <div class="field">
            <label for="f_date" data-i18n="dateLbl">تاريخ المناقشة أو التسليم (اختياري)</label>
            <input type="text" id="f_date" data-f="date">
          </div>
          </div>
          <button type="button" class="acc-next" data-next><span data-i18n="done">تم</span><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
        </div></div></div>
      </section>
    </div>
  </aside>

  <button class="panel-toggle" id="panelToggle" type="button" data-tip="toggle_panel">
    <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
  </button>

  <main class="stage" id="stage">
    <div class="stage-bar">
      <div class="zoom" id="zoomCtl">
        <button type="button" id="zoomOut" aria-label="-"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <span id="zoomVal">100%</span>
        <button type="button" id="zoomIn" aria-label="+"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
        <button type="button" id="zoomFit" data-tip="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="page-warn hidden" id="pageWarn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span data-i18n="overflowShort"></span></div>
    </div>

    <div class="flat-view" id="flatView">
      <div class="sheet-holder" id="sheetHolder">
        <div class="cv-page" id="cvPage"></div>
      </div>
    </div>
  </main>
</div>

<!-- Designs gallery -->
<div class="gallery hidden" id="gallery" role="dialog" aria-modal="true">
  <div class="gallery-box">
    <div class="gallery-head">
      <h2 data-i18n="gallery">معرض التصاميم</h2>
      <div class="chips" id="gCats">
        <button type="button" class="chip on" data-cat="all" data-i18n="cat_all">الكل</button>
        <button type="button" class="chip" data-cat="uni" data-i18n="cat_uni">جامعي</button>
        <button type="button" class="chip" data-cat="school" data-i18n="cat_school">مدرسي</button>
        <button type="button" class="chip" data-cat="pro" data-i18n="cat_pro">مهني ومؤسسي</button>
        <button type="button" class="chip" data-cat="theme" data-i18n="cat_theme">موضوعي</button>
      </div>
      <div class="g-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>

      <button class="icon-btn" id="gClose" type="button" aria-label="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="g-grid" id="gGrid"></div>
  </div>
</div>

<!-- My covers -->
<div class="gallery hidden" id="mine" role="dialog" aria-modal="true">
  <div class="gallery-box">
    <div class="gallery-head">
      <h2 data-i18n="mine">أغلفتي</h2>

        <button type="button" class="chip on" data-src="all" data-i18n="src_all">الكل</button>

        <button type="button" class="chip" data-src="cloud" data-i18n="src_cloud">في حسابي</button>
      </div>
      <button class="icon-btn" id="mClose" type="button" aria-label="close" style="margin-inline-start:auto"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

</div>

<!-- Login prompt -->
<div class="gallery hidden" id="login" role="dialog" aria-modal="true">
  <div class="login-box">
    <div class="login-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
    <h3 id="loginTitle" data-i18n="login_title">سجّل دخولك</h3>
    <p id="loginText" data-i18n="login_text"></p>
    <button type="button" class="login-google" id="loginGoogle">
      <svg viewBox="0 0 48 48" style="stroke:none"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span data-i18n="googleBtn">المتابعة عبر Google</span>
    </button>
    <div class="auth-divider"><span data-i18n="or">أو</span></div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab on" data-mode="login" id="tabLogin" data-i18n="tabLogin">تسجيل الدخول</button>
      <button type="button" class="auth-tab" data-mode="signup" id="tabSignup" data-i18n="tabSignup">إنشاء حساب</button>
    </div>
    <form id="authCardForm" class="auth-form">
      <input type="text" id="acName" class="hidden" data-i18n-placeholder="namePh">
      <input type="email" id="acEmail" required class="ltr-input" data-i18n-placeholder="emailPh">
      <input type="password" id="acPassword" required minlength="6" class="ltr-input" data-i18n-placeholder="passwordPh">
      <p class="auth-card-error hidden" id="authCardError"></p>
      <button type="submit" class="soft-btn primary" id="acSubmitBtn" data-i18n="loginBtn">تسجيل الدخول</button>
    </form>
    <button type="button" class="login-cancel" id="loginCancel" data-i18n="cancel">إلغاء</button>
  </div>
</div>

<!-- Confirm dialog -->
<div class="gallery hidden" id="confirmDlg" role="dialog" aria-modal="true">
  <div class="login-box">
    <div class="login-ico warn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
    <p id="confirmText"></p>
    <div class="dlg-actions">
      <button type="button" class="soft-btn" id="confirmNo" data-i18n="cancel">إلغاء</button>
      <button type="button" class="soft-btn danger solid" id="confirmYes" data-i18n="confirm_ok">تأكيد</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="print-root" id="printRoot" aria-hidden="true"></div>
