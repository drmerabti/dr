    </div>
    <form id="authCardForm" class="auth-form">
      <input type="text" id="acName" class="hidden" data-i18n-placeholder="namePh">
      <input type="email" id="acEmail" required class="ltr-input" data-i18n-placeholder="emailPh">
      <input type="password" id="acPassword" required minlength="6" class="ltr-input" data-i18n-placeholder="passwordPh">
      <p class="auth-card-error hidden" id="authCardError"></p>
      <button type="submit" class="soft-btn primary" id="acSubmitBtn" data-i18n="loginBtn">تسجيل الدخول</button>
    </form>
    <button type="button" class="login-cancel" id="loginCancel" data-i18n="cancel">إلغاء</button>
  </div>
</div>

<!-- Confirm dialog -->
<div class="gallery hidden" id="confirmDlg" role="dialog" aria-modal="true">
  <div class="login-box">
    <div class="login-ico warn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
    <p id="confirmText"></p>
    <div class="dlg-actions">
      <button type="button" class="soft-btn" id="confirmNo" data-i18n="cancel">إلغاء</button>
      <button type="button" class="soft-btn danger solid" id="confirmYes" data-i18n="confirm_ok">تأكيد</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="templates.js"></script>
