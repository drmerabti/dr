<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="محوّل التاريخ الميلادي والهجري (أم القرى) — أكاديمية مرابطي.">
<title>محوّل هجري/ميلادي — د. سفيان مرابطي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand" data-i18n="brand">د. سفيان مرابطي</a>
    <div class="topbar-actions">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
      <div class="auth-wrap" id="authWrap">
        <button id="authBtn" class="auth-btn" type="button"></button>
        <div id="authMenu" class="auth-menu hidden"></div>
      </div>
      <button id="langToggle" class="lang-toggle" type="button">EN</button>
    </div>
  </div>
</header>

<nav class="breadcrumbs">
  <a href="../../index.html" class="crumb-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
    <span data-i18n="home">الرئيسية</span>
  </a>
</nav>

<main id="app">
  <section class="view">
    <h2 class="view-title tool-title">
      <span class="tool-title-ar">محوّل هجري/ميلادي</span>
      <span class="tool-title-en">Hijri / Gregorian Converter</span>
    </h2>

    <div class="converter-card" id="converterCard">

      <div class="date-panel" id="gregPanel">
        <span class="panel-label">التاريخ الميلادي · Gregorian</span>
        <input type="date" id="gregInput" class="date-input greg-input">
        <p class="date-readable" id="gregReadable"></p>
      </div>

      <button id="swapBtn" class="swap-btn" type="button" aria-label="تبديل الأماكن" title="تبديل الأماكن">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3v14"/><path d="M3 13l4 4 4-4"/>
          <path d="M17 21V7"/><path d="M13 11l4-4 4 4"/>
        </svg>
      </button>

      <div class="date-panel" id="hijriPanel">
        <span class="panel-label">التاريخ الهجري · Hijri</span>
        <div class="hijri-fields">
          <input type="number" id="hijriDay" class="date-input h-num" min="1" max="30" placeholder="اليوم" aria-label="اليوم">
          <select id="hijriMonth" class="date-input h-select" aria-label="الشهر"></select>
          <input type="number" id="hijriYear" class="date-input h-num h-year" min="1300" max="1600" placeholder="السنة" aria-label="السنة">
        </div>
        <p class="date-readable" id="hijriReadable"></p>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <p data-i18n="footer_text">© 2026 د. سفيان مرابطي</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../../firebase-init.js"></script>
<script src="../../app.js"></script>
<script src="app.js"></script>
</body>
</html>
