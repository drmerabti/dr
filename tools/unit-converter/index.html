<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محوّل الوحدات | Dr Soufiane Merabti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tool.css">
</head>
<body class="uc-body">

<div class="uc-page">

  <!-- الشريط العلوي: الاسم + الأزرار في نفس الصف -->
  <header class="uc-topbar">
    <a class="uc-brand" href="../../">Dr Soufiane Merabti</a>
    <div class="uc-actions">
      <button class="uc-icon-btn" id="ucCopy" type="button" aria-label="نسخ النتيجة" title="نسخ النتيجة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>
      </button>
      <button class="uc-icon-btn" id="ucReset" type="button" aria-label="إعادة ضبط" title="إعادة ضبط">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="uc-icon-btn uc-lang" id="ucLang" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <main class="uc-wrap">

    <div class="uc-head">
      <h1 id="ucTitle">محوّل الوحدات</h1>
      <p id="ucSub"></p>
    </div>

    <nav class="uc-cats" id="ucCats" role="tablist"></nav>

    <section class="uc-card">
      <div class="uc-panel">
        <span class="uc-label" id="ucFromLbl"></span>
        <input id="ucIn" class="uc-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" dir="ltr" value="1">
        <select id="ucFrom" class="uc-select"></select>
      </div>

      <button class="uc-swap" id="ucSwap" type="button" aria-label="تبديل" title="تبديل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14"/><path d="M3 14l4 4 4-4"/><path d="M17 20V6"/><path d="M13 10l4-4 4 4"/></svg>
      </button>

      <div class="uc-panel uc-panel-out">
        <span class="uc-label" id="ucToLbl"></span>
        <div id="ucOut" class="uc-output" dir="ltr" role="button" tabindex="0">—</div>
        <select id="ucTo" class="uc-select"></select>
      </div>
    </section>

    <p class="uc-formula" id="ucFormula"></p>

    <div class="uc-sec-row">
      <h2 class="uc-sec" id="ucAllTitle"></h2>
      <span class="uc-hint" id="ucHint"></span>
    </div>
    <div class="uc-grid" id="ucGrid"></div>

  </main>
</div>

<div class="uc-toast" id="ucToast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
